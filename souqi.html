function chip(l, v) { return `<span class="pf"><span class="lbl">${l}</span><b>${v}</b></span>`; }
/* توصية سوقي: أفضل 3 خيارات مع سبب واضح لكل خيار */
function recommendCard(rows) {
  if (rows.length < 2) return '';
  const prices = rows.map(r => r.price);
  const mn = Math.min.apply(null, prices), mx = Math.max.apply(null, prices);
  const scored = rows.map(r => {
    const sp = mx === mn ? 1 : 1 - (r.price - mn) / (mx - mn);
    const sd = 1 / (1 + r.dist / 3);
    const sdisc = clamp(r.disc / 30, 0, 1);
    const srate = clamp((r.st.rating - 3.4) / 1.6, 0, 1);
    const sfresh = r.updatedH < 24 ? 1 : r.updatedH < 96 ? .6 : .2;
    return { r, v: sp * .44 + sd * .22 + sdisc * .13 + srate * .11 + sfresh * .10 + (r.inStock ? .04 : 0) };
  }).sort((a, b) => b.v - a.v);
  const seen = {}, top = [];
  scored.forEach(x => { if (top.length < 3 && !seen[x.r.storeId]) { seen[x.r.storeId] = 1; top.push(x.r); } });
  const reason = (r, i) => {
    const why = [];
    if (r.price === mn) why.push('أرخص سعر مسجّل');
    else why.push('أعلى من الأرخص بـ ' + egp(r.price - mn));
    if (r.dist <= 3) why.push('قريب جدًا (' + kmTxt(r.dist) + ')');
    else why.push(kmTxt(r.dist) + ' منك');
    if (r.disc) why.push('خصم ' + pct(r.disc));
    if (r.updatedH < 24) why.push('سعر محدث خلال 24 ساعة');
    if (r.st.verified) why.push('متجر موثق ✔️');
    if (r.open) why.push('مفتوح الآن');
    if (r.inStock) why.push('متوفر');
    return why;
  };
  const label = ['الأفضل توازنًا', 'الأوفر في الوقت', 'خيار بديل'];
  return `
  <div class="card pad mb14" style="border-color:#EBD3DB;background:linear-gradient(180deg,#FDF7F9,#fff 55%)">
    <div class="between wrapx mb14">
      <div><div class="b" style="font-size:16px">✨ توصية سوقي</div>
      <div class="tiny muted">ترتيب يوازن بين السعر والمسافة والخصم والتقييم وحداثة السعر — بدون تحيّز لأي متجر.</div></div>
      <span class="badge p">${rows.length} خيارًا متاحًا</span>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">
      ${top.map((r, i) => `
      <div class="panel" style="border-color:${i === 0 ? 'var(--p)' : 'var(--line)'}">
        <div class="between"><span class="badge ${i === 0 ? 'p' : 'ink'}">${label[i]}</span>
          <span class="tiny muted">${r.st.rating.toFixed(1)} ★</span></div>
        <div class="b mt10"><a href="#/store/${r.st.id}">${esc(r.st.name)}</a> ${r.st.verified ? '<span class="vf">✔️</span>' : ''}</div>
        <div class="priceline mt6">${priceHtml(r.price)} ${r.oldPrice ? `<span class="price-old num">${nf(r.oldPrice)}</span>` : ''}</div>
        <div class="chips mt10">${reason(r, i).map(t => `<span class="badge ink">${esc(t)}</span>`).join('')}</div>
        <div class="row gap6 mt10">
          <button class="btn primary sm2" data-act="wa" data-store="${r.st.id}" data-prod="${r.productId}">واتساب</button>
          <button class="btn sm2" data-act="dirs" data-store="${r.st.id}">🧭 الاتجاهات</button>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

function bindResults() {
  const q = $('#resQ');
  if (q) q.onkeydown = e => { if (e.key === 'Enter') go('search', Object.assign({}, APP.route.p, { q: q.value.trim() })); };
  const g = $('#resGo'); if (g) g.onclick = () => go('search', Object.assign({}, APP.route.p, { q: ($('#resQ').value || '').trim() }));
  const geo = $('#resGeo'); if (geo) geo.onclick = openLocation;
  document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => setParam('sort', b.dataset.sort));
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setParam('view', b.dataset.view));
  const fd = $('#fDist'); if (fd) fd.onchange = () => setParam('dist', fd.value);
  const fc = $('#fCity'); if (fc) fc.onchange = () => setParam('city', fc.value);
  const ft = $('#fCat'); if (ft) ft.onchange = () => setParam('cat', ft.value);
  const fo = $('#fOpen'); if (fo) fo.onchange = () => setParam('open', fo.checked ? '1' : '');
  const fs = $('#fStock'); if (fs) fs.onchange = () => setParam('stock', fs.checked ? '1' : '');
  const fof = $('#fOff'); if (fof) fof.onchange = () => setParam('off', fof.checked ? '1' : '');
  const ab = $('#alertBtnTop'); if (ab) ab.onclick = () => openAlertModal(APP.route.p.q ? (findProduct(APP.route.p.q) || {}).id : 'ip15');
  const rb = $('#reportBtnTop'); if (rb) rb.onclick = () => openReportModal();
  if (APP.route.p.view === 'map') bindRadialMap();
}
function bindProduct() {
  const rows = (DB.byProduct[APP.route.p.id || APP.route.p.pid] || []);
  $('#shareBtn') && ($('#shareBtn').onclick = () => {
    const url = location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('تم نسخ رابط المنتج', 'ok', '🔗')).catch(() => toast('انسخ الرابط من شريط العنوان', 'warn', '🔗'));

}

  const minD = APP.route.p.min ? parseFloat(APP.route.p.min) : 0;
  const city = APP.route.p.city || '';
  const sort = APP.route.p.sort || 'disc';
  let rows = DB.offers.map(l => {
    const st = DB.stores.find(s => s.id === l.storeId);
    return Object.assign({}, l, { st, dist: distKm(LOC, st), open: isOpen(st) });
  }).filter(r => r.dist <= dist && r.disc >= minD && (!cat || r.cat === cat) && (!city || r.st.city === city));
  rows.sort((a, b) => sort === 'disc' ? b.disc - a.disc : sort === 'save' ? (b.oldPrice - b.price) - (a.oldPrice - a.price) : sort === 'end' ? (a.offerEnds || 99) - (b.offerEnds || 99) : a.price - b.price);
  const save = rows.reduce((a, r) => a + (r.oldPrice - r.price), 0);
  const byCat = CATS.map(c => ({ c, n: rows.filter(r => r.cat === c.id).length, mx: rows.filter(r => r.cat === c.id).reduce((a, r) => Math.max(a, r.disc), 0) })).filter(x => x.n).sort((a, b) => b.n - a.n);

  return shell('offers', `

    </div>

    <div class="card pad mb14">
      <div class="scroll-x mb14">
        <button class="chip ${!cat ? 'on' : ''}" data-cat="">كل الأقسام</button>
        ${CATS.filter(c => DB.offers.some(l => l.cat === c.id)).map(c => `<button class="chip ${cat === c.id ? 'on' : ''}" data-cat="${c.id}">${c.em} ${c.ar}</button>`).join('')}

        <div class="field" style="min-width:150px"><label>المحافظة</label>
          <select class="select" id="offCity"><option value="">كل المحافظات</option>${Array.from(new Set(DB.offers.map(l => DB.stores.find(s => s.id === l.storeId).city))).map(c => `<option ${city === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
        <div class="field" style="min-width:150px"><label>الترتيب</label>
          <select class="select" id="offSort">
            <option value="disc">أكبر نسبة خصم</option>
            <option value="save" ${sort === 'save' ? 'selected' : ''}>أكبر توفير بالجنيه</option>

            <option value="price" ${sort === 'price' ? 'selected' : ''}>الأرخص سعرًا</option>

function assistantPage() {
  const q = APP.route.p.q != null ? APP.route.p.q : '';
  const tab = APP.route.p.tab || 'what';
  const p = q ? parseQuery(q) : null;
  const gift = /هديه|هدية|gift|عيد ميلاد/.test(norm(q));
  const max = p && p.max ? p.max : null;
  const minP = (prod) => { const ls = DB.byProduct[prod.id] || []; return ls.length ? Math.min.apply(null, ls.map(l => l.price)) : prod.base; };

  let pool = PRODUCTS.slice();
  if (gift) pool = pool.filter(x => ['audio', 'books', 'beauty', 'electronics', 'sports', 'clothing', 'home', 'mobile'].includes(x.cat));
  else if (p && p.cat) pool = pool.filter(x => x.cat === p.cat.id);
  else pool = pool.filter(x => ['home', 'electronics', 'audio', 'mobile', 'supermarket'].includes(x.cat));
  if (p && p.brand) pool = pool.filter(x => norm(x.brand) === norm(p.brand));
  const affordable = pool.filter(x => DB.byProduct[x.id] && DB.byProduct[x.id].length && (!max || minP(x) <= max));
  const beyond = max ? pool.filter(x => DB.byProduct[x.id] && DB.byProduct[x.id].length && minP(x) > max && minP(x) <= max * 1.4) : [];
  // ترتيب: أفضل استخدام للميزانية + التوفر في متاجر قريبة
  affordable.sort((a, b) => valScore(b) - valScore(a));
  function valScore(x) {
    const ls = DB.byProduct[x.id] || [];
    if (!ls.length) return -99;
    const price = minP(x);
    const budgetUse = max ? (price / max) : 0.6;
    const near = Math.min.apply(null, ls.map(l => distKm(LOC, DB.stores.find(s => s.id === l.storeId))));
    const fresh = ls.filter(l => l.updatedH < 96).length / ls.length;
    return budgetUse * 2.4 + (1 / (1 + near / 5)) + fresh * .8 + ls.length * .05;
  }

  return shell('search', `

    <div class="sec-head">
      <div><h1 style="font-size:25px">🤔 ماذا أشتري؟</h1>

        <button class="go" id="asGo">اقترح لي</button>
      </div>
      <div class="scroll-x mt10">
        ${[['عندي 10000 جنيه وعايز حاجة مفيدة للبيت', 'عايز حاجة مفيدة للبيت تحت 10000'],
      ['عايز هدية لشخص عمره 20 سنة بميزانية 1000 جنيه', 'هدية بميزانية 1000 جنيه'],
      ['أفضل موبايل تحت 15000 جنيه', 'موبايل تحت 15000'],
      ['أدوات مطبخ ومستلزمات بيت بأقل من 5000', 'مستلزمات منزل تحت 5000'],
      ['حاجة للرياضة في البيت بميزانية 2000', 'رياضة تحت 2000'],
      ['مكتبة ومستلزمات دراسة بأقل من 1000', 'كتب ومكتبة تحت 1000']]
      .map(([l, v]) => `<button class="chip" data-asq="${esc(v)}">${l}</button>`).join('')}
      </div>
    </div>

    <div class="card mb14"><div style="padding:6px 14px"><div class="tabs">
      ${[['what', '💡 اقتراحات حسب ميزانيتك'], ['bundle', '🧩 رحلة شراء (تجميعة)']].map(([k, l]) => `<a class="tab ${tab === k ? 'on' : ''}" href="#/assistant?tab=${k}${q ? '&q=' + encodeURIComponent(q) : ''}">${l}</a>`).join('')}
    </div></div>
    <div class="modal-body">
      ${tab === 'what' ? whatBlock(p, q, gift, max, affordable, beyond) : ''}

      ${tab === 'bundle' ? bundlesBlock() : ''}
    </div></div>
  </div>`);
}

function bindDashboard() {
  const sw = $('#dbStore'); if (sw) sw.onchange = () => { APP.myStore = sw.value; save('myStore', sw.value); setParam('store', sw.value); };
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = () => {
    const id = b.dataset.save;
    const l = DB.listings.find(x => x.id === id);
    const inp = document.querySelector(`[data-inp="${id}"]`), old = document.querySelector(`[data-oldinp="${id}"]`), stk = document.querySelector(`[data-stock="${id}"]`);
    const np = +inp.value;
    if (!np || np <= 0) return toast('اكتب سعرًا صحيحًا', 'warn', '⚠️');
    const from = l.price;
    l.price = np;
    if (old && old.value) { l.oldPrice = +old.value; l.disc = Math.max(0, Math.round((1 - np / (+old.value)) * 100)); }
    l.inStock = stk ? stk.checked : l.inStock;
    l.updatedH = 0.02;
    const p = PRODUCTS.find(x => x.id === l.productId);
    DB.priceLog.unshift({ store: l.storeId, product: p.name, from, to: np, by: 'المتجر', at: 'الآن' });
    toast(`تم تحديث سعر ${p.name}: ${egp(from)} ← ${egp(np)} وظهر «محدث الآن» للعملاء`, 'ok', '💾');
    render();
  });
  document.querySelectorAll('[data-fresh]').forEach(b => b.onclick = () => {
    const l = DB.listings.find(x => x.id === b.dataset.fresh); l.updatedH = 0.05; toast('تم تأكيد السعر كأحدث بيانات', 'ok', '✔️'); render();
  });
  document.querySelectorAll('[data-quick]').forEach(b => b.onclick = () => {
    const l = DB.listings.find(x => x.id === b.dataset.quick); l.updatedH = 0.05; toast('تم تأكيد السعر الحالي كبيانات حديثة', 'ok', '✔️'); render();
  });
  const bl = $('#dbBulk');
  if (bl) bl.onclick = () => {
    DB.byStore[APP.route.p.store || APP.myStore].forEach(l => l.updatedH = 0.03);
    toast('تم تحديث كل الأسعار — كل أسعارك الآن «حديثة»', 'ok', '🔄'); render();
  };
  const no = $('#dbNewOffer');
  if (no) no.onclick = () => {
    const rows2 = DB.byStore[APP.route.p.store || APP.myStore];
    openModal('🔥 إنشاء عرض جديد', `
      <div class="field mb14"><label>المنتج</label><select class="select" id="ofProd">
        ${rows2.map(l => { const p = PRODUCTS.find(x => x.id === l.productId); return `<option value="${l.id}">${esc(p.name)} — سعرك ${nf(l.price)}</option>`; }).join('')}
      </select></div>
      <div class="grid g-2 mb14">
        <div class="field"><label>نسبة الخصم</label><select class="select" id="ofDisc">${[5, 8, 10, 15, 20, 25, 30].map(v => `<option value="${v}">${v}%</option>`).join('')}</select></div>
        <div class="field"><label>مدة العرض</label><select class="select" id="ofDur">${[[3, '3 أيام'], [7, 'أسبوع'], [14, 'أسبوعان'], [30, 'شهر']].map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
      </div>
      <label class="switch"><input type="checkbox" checked> إرسال إشعار للمستخدمين الذين يتابعون هذا المنتج 🔔</label>
      <div class="insight info mt14"><span class="ic">👥</span><div class="sm">يوجد <b>${3 + Math.floor(rnd('sub' + (APP.route.p.store || APP.myStore)) * 30)}</b> مستخدمًا يتابعون منتجات متجرك — العرض سيظهر لهم في تنبيهاتهم.</div></div>`,
      `<button class="btn primary" id="ofSave">نشر العرض</button><button class="btn" onclick="closeModal()">إلغاء</button>`);
    $('#ofSave').onclick = () => {
      const l = DB.listings.find(x => x.id === $('#ofProd').value);
      const d = +$('#ofDisc').value, dur = +$('#ofDur').value;
      l.oldPrice = round(l.price / (1 - d / 100), 5); l.disc = d; l.offerEnds = dur; l.updatedH = 0.02;
      DB.offers = DB.listings.filter(x => x.disc >= 10).sort((a, b) => b.disc - a.disc);
      closeModal(); render(); toast('تم نشر العرض وظهر في صفحة العروض القريبة', 'ok', '🔥');
    };
  };
  document.querySelectorAll('[data-offdel]').forEach(b => b.onclick = () => {
    const l = DB.listings.find(x => x.id === b.dataset.offdel); l.disc = 0; l.oldPrice = null; l.offerEnds = null;
    DB.offers = DB.listings.filter(x => x.disc >= 10); render(); toast('تم إنهاء العرض', 'ok', '⏹️');
  });
  document.querySelectorAll('[data-offext]').forEach(b => b.onclick = () => {
    const l = DB.listings.find(x => x.id === b.dataset.offext); l.offerEnds = (l.offerEnds || 7) + 7; render(); toast('تم تمديد العرض أسبوعًا', 'ok', '⏱️');
  });
  document.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => {
    const st = DB.stores.find(s => s.id === (APP.route.p.store || APP.myStore));
    st.plan = b.dataset.plan; render();
    toast(st.plan === 'pro' ? 'تم تفعيل الباقة الاحترافية (توضيحي) 💎' : 'تم الرجوع للباقة المجانية', 'ok', '💎');
  });
  const f = $('#dbFilter');
  if (f) f.oninput = () => {
    const v = norm(f.value);
    $$('#dbTable tbody tr').forEach(tr => tr.style.display = !v || tr.dataset.name.includes(v) ? '' : 'none');
  };
  const ap = $('#dbAddProd');
  if (ap) ap.onclick = () => openAddProduct();
}

function bindLiveParse() {

    const el = $(sel); if (!el) return;
    const box = sel === '#heroSearch' || sel === '#resQ' ? $('#parseLive') : null;

      const q = el.value.trim();
      if (!box) return;
      if (!q) { box.innerHTML = ''; return; }
      const p = parseQuery(q);
      const chips = [];
      if (p.product) chips.push(`<span class="pf ${el.id === 'heroSearch' ? '' : ''}" style="${el.id === 'heroSearch' ? 'background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#FBE9EF' : ''}"><span class="lbl" style="${el.id === 'heroSearch' ? 'color:#D2B4BE' : ''}">المنتج</span><b>${esc(p.product.name)}</b></span>`);
      if (p.cat && !p.product) chips.push(`<span class="pf"><span class="lbl">القسم</span><b>${p.cat.em} ${p.cat.ar}</b></span>`);
      if (p.brand) chips.push(`<span class="pf"><span class="lbl">الماركة</span><b>${esc(p.brand)}</b></span>`);
      if (p.max) chips.push(`<span class="pf"><span class="lbl">أقصى سعر</span><b class="num">${egp(p.max)}</b></span>`);
      if (p.near) chips.push(`<span class="pf"><span class="lbl">المكان</span><b>قريب مني</b></span>`);
      if (/مفتوح|فاتح|شغال|دلوقتي/.test(norm(q))) chips.push(`<span class="pf"><span class="lbl">الحالة</span><b>مفتوح الآن</b></span>`);
      box.innerHTML = chips.length
        ? `<div class="row wrapx gap6" style="align-items:center"><span class="tiny" style="color:${el.id === 'heroSearch' ? '#D2B4BE' : 'var(--muted)'}">🧠 فهمت من طلبك:</span>${chips.join('')}</div>`
        : `<div class="tiny" style="color:${el.id === 'heroSearch' ? '#D2B4BE' : 'var(--muted)'}">اكتب بحرية: اسم المنتج، ميزانيتك، و«قريبة مني» — وسوقي يفهم الطلب ويعرض النتائج.</div>`;
    };
    el.oninput = upd;
    el.onkeydown = e => { if (e.key === 'Enter') { searchFrom(el.value.trim(), sel); } };
    upd();
  });
  const hg = $('#heroGo'); if (hg) hg.onclick = () => searchFrom(($('#heroSearch') || {}).value || '', '#heroSearch');
  const hgeo = $('#heroGeo'); if (hgeo) hgeo.onclick = () => { go('nearby'); realSearch({ locate: true }); };   // موقع حقيقي + بحث حقيقي
}

/* تحليل قائمة ملصوقة: «سماعة JBL 2500» أو «اسم المنتج - 2,500 - متوفر» */
function regParsePasted(text) {
  const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
  const rows = [];
  lines.forEach(line => {
    let name = line, price = '', old = '', stock = true;
    if (/خلص|غير متوفر|مش متوفر|ناقص/.test(line)) stock = false;
    const nums = (line.match(/\d[\d,\.]{2,}/g) || []).map(x => parseFloat(x.replace(/[,\s]/g, ''))).filter(n => n >= 20);
    if (nums.length >= 2) { old = Math.max(nums[0], nums[1]); price = Math.min(nums[0], nums[1]); }
    else if (nums.length === 1) { price = nums[0]; }
    name = line.replace(/\d[\d,\.]*/g, '').replace(/[-–|،,]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (!name || !price) return;
    const prod = findProduct(name);
    rows.push({
      name: prod ? prod.name : name, cat: prod ? prod.cat : (REG.cats[0] || 'electronics'),
      brand: prod ? prod.brand : '', model: '', price: price, old: old || '', qty: '', stock,
      warranty: REG.warranty, condition: 'جديد', desc: ''
    });
  });
  return rows;
}
function regParseCSV(text) {
  const rows = [];
  String(text || '').split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    if (i === 0 && /اسم|name/i.test(line)) return;   // تخطّي صف العناوين
    const c = line.split(/[,;\t]/).map(x => x.replace(/^"|"$/g, '').trim());
    if (!c[0]) return;
    rows.push({
      name: c[0], price: c[1] || '', old: c[2] || '', brand: c[3] || '', model: c[4] || '',
      qty: c[5] || '', stock: !/0|لا|غير/.test(c[6] || ''), cat: REG.cats[0] || 'electronics',
      warranty: REG.warranty, condition: 'جديد', desc: c[7] || ''
    });
  });
  return rows;
}
function regCSVTemplate() {
  const head = 'name,price,price_before,brand,model,quantity,available,notes';

}

const REG_CITIES = {};
DB.stores.forEach(s => { if (!REG_CITIES[s.city]) REG_CITIES[s.city] = { lat: s.lat, lon: s.lon, n: 0 }; REG_CITIES[s.city].n++; });
function nearestRegCity(lat, lon) {
  let best = null, bd = 1e9;
  Object.keys(REG_CITIES).forEach(c => {
    const d = distKm({ lat, lon }, { lat: REG_CITIES[c].lat, lon: REG_CITIES[c].lon });
    if (d < bd) { bd = d; best = c; }
  });
  return { city: best, d: bd };
}

/* اكتمال بيانات متجر مسجّل (للتحقق السريع من لوحة التحكم والدليل) */
function regCompletenessExtra(st) {
  const missing = [];
  if (!st.desc || st.desc.length < 20) missing.push('وصف المتجر');
  if (!st.landmark) missing.push('علامة مميزة قريبة');
  if (!st.street || !st.buildingNo) missing.push('الشارع ورقم العقار');
  if (!st.hours) missing.push('تفصيل مواعيد الأيام');
  if (!st.priceManager) missing.push('مسؤول تحديث الأسعار');
  if (!(st.media && (st.media.facade || st.media.inside))) missing.push('صور المتجر');
  if (!st.gmapsUrl) missing.push('رابط خرائط جوجل');
  if (!(st.tags || []).length) missing.push('كلمات التخصص');
  const base = (DB.byStore[st.id] || []).length ? 55 : 30;
  const pct = Math.min(100, base + (8 - missing.length) * 5);
  return { pct: pct, missing: missing };
}

function regFromStore(id) {

  const rows = DB.byStore[id] || [];

  REG.logoEmoji = catOf(st.cats[0]).em;

    return { name: p.name, cat: p.cat || l.cat, brand: p.brand || l.brand, model: '', price: l.price, old: l.oldPrice || '', qty: '', stock: l.inStock, warranty: l.warranty || REG.warranty, condition: 'جديد', desc: '' };
  });
  REG.media = { logo: true, facade: true, inside: true, shelf: true, products: false, video: '' };
  REG.docs = { commercialReg: st.verified, tax: st.verified, signPhoto: st.verified, phoneProof: true, idCard: false };
  regSave();
}
function hoursFromStore(st) {
  const h = {};
  for (let i = 0; i < 7; i++) {
    const closed = st.fri === 'off' && i === 5;
    const openH = st.fri === 'late' && i === 5 ? Math.max(st.openH, 14) : st.openH;
    h[i] = { closed: closed, open: timeTxt(openH), close: timeTxt(st.closeH % 24), note: '' };
  }
  REG.hours = h;
}

/* ------------------------- أحداث وحدة التسجيل ------------------------- */
function regBlankReset(keepEdit) {
  const fresh = regBlank();
  Object.keys(fresh).forEach(k => REG[k] = fresh[k]);
  if (keepEdit && APP.route.p.edit) REG.edit = APP.route.p.edit;
  regSave();
}
function regGotoStep(s) {
  REG.step = s; regSave();
  go('addstore', Object.assign({ step: s }, REG.edit ? { edit: REG.edit } : {}));
}
function regError(msg) {
  $('#regErr').innerHTML = `<div class="insight bad"><span class="ic">⚠️</span><div class="sm">${msg}</div></div>`;
  toast(msg.replace(/<[^>]+>/g, ''), 'warn', '⚠️');
}
function regValidate(step) {
  if (step === 1) {
    if (!REG.name || REG.name.length < 3) return 'اكتب اسم المتجر (3 أحرف على الأقل).';
    if (!REG.cats.length) return 'اختر قسمًا واحدًا على الأقل من «أقسام النشاط».';
  }
  if (step === 2) {
    if (!REG.city || !REG.area) return 'حدّد المحافظة والمنطقة.';
    if (!REG.street) return 'اكتب اسم الشارع — العنوان التفصيلي يساعد العميل يوصل.';
  }
  if (step === 4) {
    if (!REG.phone || !/^01\d{9}$/.test(String(REG.phone).replace(/\D/g, ''))) return 'اكتب رقم هاتف صحيح يبدأ بـ 01 (11 رقمًا).';
    if (!REG.priceManager) return 'حدّد اسم مسؤول تحديث الأسعار — بدون مسؤول، الأسعار بتقدم وتفقد المنصة مصداقيتها.';
    if (!REG.priceManagerPhone && !REG.whatsapp && !REG.phone) return 'أضف رقم واتساب لمسؤول الأسعار أو للتواصل.';
  }
  if (step === 6) {
    const ready = REG.products.filter(p => p.name && +p.price > 0);
    if (!ready.length) return 'أضف منتجًا واحدًا على الأقل باسم وسعر — هذا أساس ظهورك في نتائج البحث.';
    const bad = REG.products.find(p => p.name && !(+p.price > 0));
    if (bad) return `المنتج «${esc(bad.name)}» ليس له سعر. اضبط السعر أو احذف الصف.`;
  }
  if (step === 7) {
    const m = ['facade', 'inside', 'shelf'].some(k => REG.media[k]);
    if (!m) return 'أضف صورة واحدة على الأقل للمتجر (واجهة أو داخل) — الصور ترفع نسبة التواصل.';
  }
  if (step === 8) {
    if (!REG.edit && (!REG.agree || !REG.agreeTruth)) return 'لازم الموافقة على الشروط والإقرار بصحة البيانات قبل النشر.';
  }
  return null;
}
function regNext() {
  const step = regStep();
  const err = regValidate(step);
  if (err) return regError(err);
  if (step === 8) return regSubmit();
  regGotoStep(Math.min(8, step + 1));
}
function regSubmit() {
  const err = regValidate(8);
  if (err) return regError(err);
  const store = regToStore();
  const id = store.id;
  if (REG.edit && DB.stores.some(s => s.id === id)) return regUpdateExisting(store);
  DB.stores.push(store); DB.byStore[id] = []; DB.reviews[id] = [];
  REG.products.filter(p => p.name && +p.price > 0).forEach((row, i) => {
    const match = PRODUCTS.find(p => norm(p.name) === norm(row.name)) ||
      PRODUCTS.find(p => row.name.length > 4 && norm(p.name).includes(norm(row.name))) ||
      PRODUCTS.find(p => row.brand && norm(p.brand) === norm(row.brand) && row.model && norm(p.name).includes(norm(row.model)));
    const pid = match ? match.id : 'reg' + id + i;
    if (!match) PRODUCTS.push(P(pid, row.name, row.brand || 'متجر', row.cat || store.cats[0], +row.price, catOf(row.cat || store.cats[0]).em, norm(row.name + ' ' + (row.brand || ''))));
    const price = +row.price, old = row.old ? +row.old : null;
    const L = {
      id: 'L' + id + i, storeId: id, productId: pid, price: price,
      oldPrice: old && old > price ? old : null, disc: old && old > price ? Math.round((1 - price / old) * 100) : 0,
      inStock: row.stock !== false, updatedH: 0, brand: row.brand || (match ? match.brand : 'متجر'),
      cat: row.cat || store.cats[0], warranty: row.warranty || REG.warranty,
      offerEnds: old && old > price ? 10 : null
    };
    DB.listings.push(L); DB.byStore[id].push(L); (DB.byProduct[pid] = DB.byProduct[pid] || []).push(L);
  });
  DB.offers = DB.listings.filter(l => l.disc >= 10).sort((a, b) => b.disc - a.disc);
  DB.reviews[id] = [];
  APP.myStore = id; save('myStore', id);
  const pct = regCompleteness().pct;
  const n = DB.byStore[id].length;
  regBlankReset(false);
  toast(`تم تسجيل «${store.name}» ونشره 🎉 — ${n} منتجًا، اكتمال بيانات ${pct}%`, 'ok', '🏪');

/* تحديث محل مسجّل ببيانات وحدة التسجيل (أسعار + بيانات + سجل تغييرات) */
function regUpdateExisting(store) {
  const old = DB.stores.find(s => s.id === store.id);
  const oldRows = (DB.byStore[store.id] || []).slice();
  Object.keys(store).forEach(k => { if (k !== 'id' && k !== 'weekly' && k !== 'rating' && k !== 'rc') old[k] = store[k]; });
  const kept = [];
  REG.products.filter(p => p.name && +p.price > 0).forEach((row, i) => {
    let L = oldRows.find(l => { const p = PRODUCTS.find(x => x.id === l.productId); return p && norm(p.name) === norm(row.name); });
    if (L) {
      const from = L.price;
      L.price = +row.price;
      L.oldPrice = row.old && +row.old > +row.price ? +row.old : null;
      L.disc = L.oldPrice ? Math.round((1 - L.price / L.oldPrice) * 100) : 0;
      L.inStock = row.stock !== false;
      L.warranty = row.warranty || L.warranty;
      L.updatedH = 0.02;
      if (from !== L.price) DB.priceLog.unshift({ store: store.id, product: row.name, from: from, to: L.price, by: 'المتجر', at: 'الآن' });
      kept.push(L.id);
      return;
    }
    const match = PRODUCTS.find(p => norm(p.name) === norm(row.name));
    const pid = match ? match.id : 'reg' + store.id + i;
    if (!match) PRODUCTS.push(P(pid, row.name, row.brand || 'متجر', row.cat || old.cats[0], +row.price, catOf(row.cat || old.cats[0]).em, norm(row.name)));
    const NL = {
      id: 'L' + store.id + 'u' + i, storeId: store.id, productId: pid, price: +row.price,
      oldPrice: row.old && +row.old > +row.price ? +row.old : null,
      disc: row.old && +row.old > +row.price ? Math.round((1 - +row.price / +row.old) * 100) : 0,
      inStock: row.stock !== false, updatedH: 0.02, brand: row.brand || 'متجر', cat: row.cat || old.cats[0],
      warranty: row.warranty || REG.warranty, offerEnds: row.old ? 10 : null
    };
    DB.listings.push(NL); DB.byStore[store.id].push(NL); (DB.byProduct[pid] = DB.byProduct[pid] || []).push(NL);
    kept.push(NL.id);
  });
  /* حذف الأسعار التي أُزيلت من الاستمارة */
  DB.byStore[store.id] = DB.byStore[store.id].filter(l => kept.indexOf(l.id) >= 0);
  DB.listings = DB.listings.filter(l => l.storeId !== store.id || kept.indexOf(l.id) >= 0);
  Object.keys(DB.byProduct).forEach(pid => { DB.byProduct[pid] = DB.byProduct[pid].filter(l => l.storeId !== store.id || kept.indexOf(l.id) >= 0); });
  old.completeness = regCompleteness().pct;
  old.plan = REG.plan || old.plan;
  DB.offers = DB.listings.filter(l => l.disc >= 10).sort((a, b) => b.disc - a.disc);
  const n = DB.byStore[store.id].length;
  const nm = old.name, pct = old.completeness;
  REG.edit = null; regSave();
  toast(`تم حفظ بيانات «${nm}» 💾 — ${n} منتجًا، اكتمال ${pct}%`, 'ok', '💾');
  go('store', { id: store.id, tab: 'info' });
}

function bindRegister() {

      let v = el.value;
      if (key === 'lat' || key === 'lon') v = parseFloat(v) || 0;
      REG[key] = v; regSave();

    };

      tr.value = ''; regSave(); render();

function bindRegMap() {
  const svg = $('#regMap'); if (!svg) return;
  const base = { x: 0, y: 0, w: 780, h: 700 };
  let vb = Object.assign({}, base);
  const apply = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const toSvg = (ev) => {
    const r = svg.getBoundingClientRect();
    return {
      x: vb.x + ((ev.clientX - r.left) / r.width) * vb.w,
      y: vb.y + ((ev.clientY - r.top) / r.height) * vb.h
    };
  };
  svg.addEventListener('click', e => {
    if (e.target.closest('[data-regcity]')) return;
    const p = toSvg(e);
    REG.lon = +(24.5 + (p.x - 40) / 56).toFixed(5);
    REG.lat = +(31.6 - (p.y - 34) / 62.8).toFixed(5);
    regSave(); refreshRegMap();
    const n = nearestRegCity(REG.lat, REG.lon);
    toast(`تم تحديد الموقع — أقرب مدينة: ${n.city} (≈ ${kmTxt(n.d)})`, 'ok', '📍');
    refreshSide();
  });
  let drag = null;
  svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y, moved: 0 }; });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved = Math.abs(dx) + Math.abs(dy);
    vb.x = drag.vx - dx * vb.w / r.width;
    vb.y = drag.vy - dy * vb.h / r.height;
    apply();
  });
  svg.addEventListener('pointerup', () => { drag = null; });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY > 0 ? 1.15 : 0.87;
    const nw = clamp(vb.w * f, 220, 900);
    const cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2;
    vb.w = nw; vb.h = nw * (base.h / base.w);
    vb.x = cx - vb.w / 2; vb.y = cy - vb.h / 2;
    apply();
  }, { passive: false });
  document.querySelectorAll('[data-regcity]').forEach(g => g.onclick = () => {
    const c = g.dataset.regcity;
    REG.city = c; REG.lat = REG_CITIES[c].lat; REG.lon = REG_CITIES[c].lon;
    regSave(); refreshRegMap(); render();
    toast('تم اختيار ' + c, 'ok', '📍');
  });
  document.querySelectorAll('[data-regcityjump]').forEach(b => b.onclick = () => {
    const c = b.dataset.regcityjump;
    REG.city = c; REG.lat = REG_CITIES[c].lat; REG.lon = REG_CITIES[c].lon;
    regSave(); refreshRegMap(); render();
  });
  const me = $('#regMapMe');
  if (me) me.onclick = () => {
    if (!navigator.geolocation) return toast('المتصفح لا يدعم تحديد الموقع — اضغط على الخريطة', 'warn', '📍');
    toast('جارٍ قراءة موقعك...', 'ok', '📡');
    navigator.geolocation.getCurrentPosition(p => {
      REG.lat = +p.coords.latitude.toFixed(5); REG.lon = +p.coords.longitude.toFixed(5);
      const n = nearestRegCity(REG.lat, REG.lon);
      REG.city = n.city || REG.city;
      regSave(); refreshRegMap();
      toast('تم ضبط موقع المتجر من موقعك الحالي — أقرب مدينة: ' + n.city, 'ok', '📍');
    }, () => toast('لم نتمكن من قراءة الموقع — اضغط على الخريطة يدويًا', 'warn', '📍'));
  };
  const rs = $('#regMapReset');
  if (rs) rs.onclick = () => { vb = Object.assign({}, base); apply(); };
}

          <div class="tiny muted">أرخص سعر ${egp(b.price)} — زيادة ${egp(b.price - max)} عن ميزانيتك · ${esc(b.st.name)}</div></div></div></div>`;
  }).join('')}
      </div>
    </div>`;

  return chips + `
    <div class="b mb10">✅ ${affordable.length} خيارًا داخل ميزانيتك (أرخص سعر مسجّل لكل منتج)</div>
    <div class="grid g-auto">${cards}</div>
    ${beyondSec}
    <div class="insight info mt14"><span class="ic">🧠</span><div class="sm">الترتيب هنا يوازن بين استخدام الميزانية، قرب المتجر، وحداثة السعر — ولا يعرض أي منتج أو سعر غير مسجّل من متجر حقيقي على المنصة.</div></div>`;
}

function bundlesBlock() {
  const cards = BUNDLES.map(bd => {
    const items = bd.items.map(pid => {
      const p = PRODUCTS.find(x => x.id === pid);
      const ls = (DB.byProduct[pid] || []).map(l => Object.assign({}, l, { st: DB.stores.find(s => s.id === l.storeId), dist: distKm(LOC, DB.stores.find(s => s.id === l.storeId)) })).sort((a, b) => a.price - b.price);
      return { p, b: ls[0], n: ls.length };
    }).filter(x => x.b && x.p);
    if (!items.length) return '';
    const total = items.reduce((a, x) => a + x.b.price, 0);
    const stores = new Set(items.map(x => x.b.st.id)).size;
    const maxD = Math.max.apply(null, items.map(x => x.b.dist));
    const single = DB.stores.map(s => {
      const have = items.filter(x => (DB.byStore[s.id] || []).some(l => l.productId === x.p.id));
      if (have.length !== items.length) return null;
      return { st: s, total: have.reduce((a, x) => a + (DB.byStore[s.id].find(l => l.productId === x.p.id).price), 0) };
    }).filter(Boolean).sort((a, b) => a.total - b.total)[0];
    return `<div class="card pad mb14">
      <div class="between wrapx">
        <div class="row"><span style="font-size:26px">${bd.em}</span>
          <div><div class="b" style="font-size:16px">${bd.name}</div><div class="tiny muted">${bd.note}</div></div></div>
        <div class="center"><div class="tiny muted">التكلفة التقريبية</div><div class="price big num">${egp(total)}</div>
          <div class="tiny muted">${stores} متجر · أبعد نقطة ${kmTxt(maxD)}</div></div>
      </div>
      <div class="tbl-wrap mt14"><table class="tbl">
        <thead><tr><th>المكوّن</th><th>أرخص سعر مسجّل</th><th>المتجر</th><th>المسافة</th><th>بدائل</th><th></th></tr></thead>
        <tbody>${items.map(x => `<tr>
          <td><div class="td-store"><span class="thumb" style="width:34px;height:34px;font-size:16px;border-radius:9px">${x.p.em}</span><span class="sm b">${esc(x.p.name)}</span></div></td>
          <td class="num b">${egp(x.b.price)}</td>
          <td class="sm"><a href="#/store/${x.b.st.id}">${esc(x.b.st.name)}</a> ${x.b.st.verified ? '✔️' : ''}</td>
          <td class="num sm">${kmTxt(x.b.dist)}</td>
          <td class="sm num">${x.n} متجر</td>
          <td><a class="btn sm2" href="#/product/${x.p.id}">استبدال</a></td></tr>`).join('')}
        </tbody></table></div>
      <div class="row wrapx gap6 mt10">
        <span class="badge ink">إجمالي ${egp(total)}</span>
        ${single ? `<span class="badge ok">متاح كامل في ${esc(single.st.name)} بإجمالي ${egp(single.total)}</span>`
        : '<span class="badge warn">لا يوجد متجر واحد فيه كل المكوّنات — رتّب زيارتك على أساس المسافات</span>'}
      </div>
    </div>`;
  }).join('');
  return cards + `<div class="insight info"><span class="ic">🧠</span><div class="sm">هذه التجميعات مبنية على المنتجات المسجّلة على المنصة. في النسخة النهائية يمكن للمستخدم تخصيص التجميعة، ونظام التوافق (مثل توافق المعالج مع اللوحة) يكون من قاعدة بيانات المواصفات.</div></div>`;
}

function init() {
  injectBrandIcon();          // أيقونة العلامة في تبويب المتصفح
  loadRealEdits();            // تصحيحات المستخدم على بيانات OSM
  loadUserPrices();           // الأسعار التي سجّلها المستخدم لمحلات حقيقية
  realCacheLoad();            // آخر نتائج بحث حقيقي (محفوظة على الجهاز)
  if (!location.hash) location.hash = '#/home';
  if (!APP.history.length) APP.history = [{ q: 'ايفون 15 تحت 40000', at: 'أمس' }, { q: 'سماعة JBL قريبة مني', at: 'منذ 3 أيام' }];
  render();
  setTimeout(() => {
    toast('أهلًا في سوقي! جرّب: «عايز سماعة JBL تحت 3000 جنيه قريبة مني»', 'ok', '👋');
  }, 800);
  setTimeout(() => {
    if (!load('seenTour', false)) { tourModal(); save('seenTour', true); }
  }, 2000);
}
window.addEventListener('DOMContentLoaded', init);
window.addEventListener('error', (e) => {
  const box = document.getElementById('app');
  if (box && !box.innerHTML.trim()) box.innerHTML = '<div class="wrap" style="padding:40px 18px"><div class="card pad center"><div style="font-size:32px">⚠️</div><div class="b mt6">حدث خطأ أثناء تحميل الصفحة</div><p class="tiny muted mt6">' + (e.message || '') + '</p></div></div>';
});
