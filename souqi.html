<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA STUDY — نوفا ستادي</title>
<meta name="theme-color" content="#070b18">
<style>
:root{--bg:#070b18;--panel:#10172a;--panel2:#141d35;--line:#263252;--text:#fff;--muted:#a8b2c7;--p:#7c6cff;--c:#00d9ff;--good:#20e3a2;--warn:#ffb84d;--danger:#ff5c7a;--shadow:0 18px 50px #02040d80}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,#27307a55,transparent 38%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,"Segoe UI",Tahoma,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{display:flex;min-height:100vh}.side{width:250px;background:#090e20cc;border-left:1px solid #ffffff10;padding:25px 16px;position:fixed;inset:0 0 0 auto;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:18px;padding:6px 10px 30px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--c),var(--p));display:grid;place-items:center;box-shadow:0 0 28px #00d9ff55}.logo:after{content:'✦';font-size:22px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}.nav{display:grid;gap:7px}.nav button{background:none;padding:13px 14px;border-radius:13px;text-align:right;color:var(--muted);display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{color:#fff;background:linear-gradient(90deg,#7c6cff22,#00d9ff10);box-shadow:inset -3px 0 var(--c)}.nav i{font-style:normal;width:20px;text-align:center;color:var(--c)}.main{margin-right:250px;flex:1;max-width:1400px;padding:28px 38px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.top h1{margin:0;font-size:24px}.muted{color:var(--muted)}.date{font-size:13px;color:var(--muted)}.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#5b4ee8,#00badf);display:grid;place-items:center;font-weight:800}.topright{display:flex;align-items:center;gap:16px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:linear-gradient(145deg,#141d35e8,#0e1528e8);border:1px solid #ffffff13;border-radius:22px;padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(15px)}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.hero h2{font-size:31px;margin:4px 0 8px}.hero p{color:var(--muted);margin:0 0 22px}.glow{background:linear-gradient(110deg,var(--p),var(--c));box-shadow:0 10px 30px #6157ed66;padding:13px 21px;border-radius:13px;font-weight:800;position:relative;overflow:hidden}.glow:before{content:'';position:absolute;inset:-3px;border:1px solid #fff8;border-radius:inherit;animation:pulse 2.7s infinite}.secondary{background:#ffffff0d;border:1px solid #ffffff18;padding:12px 17px;border-radius:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.progress{display:flex;align-items:center;gap:20px}.ring{width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--c) 72%,#273452 0);display:grid;place-items:center;box-shadow:0 0 28px #00d9ff35}.ring:after{content:'';width:84px;height:84px;border-radius:50%;background:var(--panel);position:absolute}.ring b{position:relative;z-index:1;font-size:24px}.stat b{font-size:24px;display:block;margin-top:8px}.stat span{color:var(--muted);font-size:13px}.section{margin-top:28px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sectionhead h2{font-size:18px;margin:0}.subjects{grid-template-columns:repeat(4,1fr)}.subject{min-height:130px;position:relative;overflow:hidden}.subject:after{content:'';position:absolute;width:100px;height:100px;background:var(--accent);filter:blur(50px);opacity:.2;left:-20px;bottom:-40px}.subject .symbol{font-size:28px;color:var(--accent)}.subject h3{margin:7px 0 0}.bar{height:6px;background:#273452;border-radius:20px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--c));border-radius:inherit}.task{display:flex;align-items:center;gap:14px}.check{width:22px;height:22px;border:1px solid var(--c);border-radius:7px}.task small{display:block;color:var(--muted)}.quick{grid-template-columns:repeat(3,1fr)}.quick .card{display:flex;gap:14px;align-items:center;cursor:pointer}.quick .ic{font-size:25px;color:var(--c)}.page{animation:enter .35s ease}.empty{padding:60px;text-align:center}.list{display:grid;gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px}.subject-detail{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{padding:10px 15px;border-radius:10px;background:#ffffff0b;color:var(--muted)}.tabs button.on{background:var(--p);color:#fff}.input{width:100%;background:#0a1022;border:1px solid var(--line);padding:14px;border-radius:12px;color:#fff;outline:0}.input:focus{border-color:var(--c);box-shadow:0 0 0 3px #00d9ff16}.modal{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:20px}.modalbox{max-width:500px;width:100%;background:#111a30;border:1px solid #ffffff20;border-radius:22px;padding:24px}.fab{position:fixed;bottom:28px;right:28px;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--p));box-shadow:0 0 0 7px #00d9ff14,0 0 35px #6c5ce799;z-index:8;animation:float 3s ease-in-out infinite}.fab:after{content:'✦';font-size:25px}.toast{position:fixed;left:25px;bottom:25px;padding:14px 18px;background:#17213a;border:1px solid #ffffff22;border-radius:12px;z-index:30;box-shadow:var(--shadow)}.bottom{display:none}@keyframes pulse{50%{transform:scale(1.05);opacity:.3}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:850px){.side{display:none}.main{margin:0;padding:20px 16px 100px}.hero,.subject-detail{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.subjects{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;inset-inline:0;background:#0b1124ee;border-top:1px solid #ffffff15;z-index:7;justify-content:space-around;padding:9px 4px env(safe-area-inset-bottom)}.bottom button{background:none;color:var(--muted);font-size:11px;display:grid;gap:2px;place-items:center}.bottom button.active{color:var(--c)}.bottom i{font-style:normal;font-size:19px}.fab{bottom:75px;right:18px}.top{margin-bottom:20px}.date{display:none}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><span class="logo"></span><span>NOVA STUDY<small>نوفا ستادي</small></span></div><nav class="nav" id="nav"></nav><div class="card" style="margin-top:30px;padding:15px"><small class="muted">جلسة التركيز القادمة</small><b style="display:block;margin:5px 0">رياضيات · 25 دقيقة</b><button class="glow" style="width:100%;padding:9px" onclick="startFocus()">ابدأ الآن</button></div></aside><main class="main"><header class="top"><div><div class="date">الخميس، 1 أكتوبر 2026</div><h1 id="title">لوحة القيادة</h1></div><div class="topright"><button class="secondary" onclick="toggleLang()">عربي / EN</button><div class="avatar">أ</div></div></header><section id="view" class="page"></section></main></div><button class="fab" onclick="openHelper()" aria-label="مساعد الدراسة"></button><nav class="bottom" id="bottom"></nav><div id="modal"></div><div id="toast"></div>
<script>
const S={lang:'ar',page:'home',subject:null,done:0};const subjects=[['رياضيات','∑','#7c6cff','72%','12 درس'],['فيزياء','◈','#00d9ff','54%','8 دروس'],['كيمياء','◌','#20e3a2','38%','6 دروس'],['لغة عربية','أ','#ffb84d','81%','15 درس']];
const navItems=[['home','⌂','الرئيسية'],['subjects','▦','موادي'],['library','▤','المكتبة'],['quiz','✓','الاختبارات'],['stats','◒','إحصائياتي'],['profile','○','حسابي']];
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';const titles={home:'لوحة القيادة',subjects:'موادي',library:'مكتبتي',quiz:'اختباراتي',stats:'إحصائياتي',profile:'حسابي',subject:'الرياضيات'};document.querySelector('#title').textContent=titles[S.page]||'نوفا ستادي';document.querySelector('#nav').innerHTML=navItems.map(x=>`<button class="${S.page===x[0]?'active':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');document.querySelector('#bottom').innerHTML=navItems.slice(0,5).map(x=>`<button class="${S.page===x[0]?'active':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');document.querySelector('#view').innerHTML=pages[S.page]();}
function go(p){S.page=p;render()}function toast(t){document.querySelector('#toast').innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>document.querySelector('#toast').innerHTML='',2800)}
const subjectCards=()=>subjects.map((s,i)=>`<article class="card subject" style="--accent:${s[2]};cursor:pointer" onclick="openSubject(${i})"><span class="symbol">${s[1]}</span><h3>${s[0]}</h3><small class="muted">${s[4]}</small><div class="bar"><i style="width:${s[3]}"></i></div><small class="muted">${s[3]} مكتمل</small></article>`).join('');
const pages={home:()=>`<div class="hero"><div class="card"><span class="muted">صباح الخير، أحمد</span><h2>جاهز لمذاكرة اليوم؟</h2><p>كل ما تحتاجه لتتعلم بوضوح، في مكان واحد.</p><div class="actions"><button class="glow" onclick="startFocus()">ابدأ المذاكرة</button><button class="secondary" onclick="go('subjects')">استكشف موادي</button></div></div><div class="card progress"><div class="ring"><b>72%</b></div><div><span class="muted">إنجازك اليوم</span><h2 style="margin:4px 0">45 دقيقة</h2><small class="muted">3 دروس · 18 سؤال</small></div></div></div><div class="grid stats section"><div class="card stat"><span>سلسلة التعلم</span><b>7 أيام</b><small style="color:var(--good)">استمر بهذا التقدم</small></div><div class="card stat"><span>الأسئلة المحلولة</span><b>128</b><small class="muted">هذا الشهر</small></div><div class="card stat"><span>البطاقات المستحقة</span><b>12</b><small style="color:var(--warn)">حان وقت المراجعة</small></div><div class="card stat"><span>متوسط الدرجات</span><b>84%</b><small style="color:var(--good)">+8% هذا الأسبوع</small></div></div><div class="section"><div class="sectionhead"><h2>ماذا ستدرس اليوم؟</h2><button class="secondary" onclick="go('subjects')">عرض الكل</button></div><div class="grid subjects">${subjectCards()}</div></div><div class="section"><div class="sectionhead"><h2>خطة اليوم</h2><span class="muted">الخميس</span></div><div class="card list"><div class="task"><span class="check"></span><div style="flex:1"><b>مراجعة قوانين نيوتن</b><small>فيزياء · 25 دقيقة</small></div><span class="muted">09:00</span></div><div class="task"><span class="check"></span><div style="flex:1"><b>حل مسائل التفاضل</b><small>رياضيات · 40 دقيقة</small></div><span class="muted">10:00</span></div><div class="task"><span class="check"></span><div style="flex:1"><b>مراجعة البطاقات</b><small>12 بطاقة · 15 دقيقة</small></div><span class="muted">18:00</span></div></div></div><div class="grid quick section"><div class="card" onclick="openUpload()"><span class="ic">＋</span><div><b>أضف مادة</b><small class="muted">PDF، صورة أو نص</small></div></div><div class="card" onclick="openHelper()"><span class="ic">✦</span><div><b>مساعدة دراسية</b><small class="muted">حل، شرح، تلخيص</small></div></div><div class="card" onclick="go('quiz')"><span class="ic">✓</span><div><b>اختبر نفسك</b><small class="muted">اختبار سريع</small></div></div></div>`,subjects:()=>`<div class="card"><div class="row"><div><h2 style="margin:0">مساحتك الدراسية</h2><p class="muted">تابع تقدمك في كل مادة وواصل من حيث توقفت.</p></div><button class="glow" onclick="openUpload()">＋ إضافة مادة</button></div></div><div class="grid subjects section">${subjectCards()}</div>`,subject:()=>`<div class="card"><div class="row"><div><span class="muted">موادي / الرياضيات</span><h2 style="margin:5px 0">الرياضيات</h2><p class="muted">تقدمك 72% · 12 درس · آخر نشاط منذ ساعتين</p></div><div class="ring" style="width:88px;height:88px"><b style="font-size:18px">72%</b></div></div><div class="tabs"><button class="on">الدروس</button><button>الملخصات</button><button>الأسئلة</button><button>البطاقات</button><button>الأخطاء السابقة</button></div></div><div class="subject-detail section"><div class="card"><span class="symbol">▤</span><h3>الدروس</h3><p class="muted">التفاضل · التكامل · المتجهات</p><button class="secondary" onclick="toast('تم فتح قائمة الدروس')">متابعة</button></div><div class="card"><span class="symbol">✓</span><h3>تدرب الآن</h3><p class="muted">15 سؤالًا بانتظارك</p><button class="glow" onclick="go('quiz')">ابدأ التدريب</button></div><div class="card"><span class="symbol">▣</span><h3>بطاقات المراجعة</h3><p class="muted">8 بطاقات مستحقة</p><button class="secondary" onclick="toast('وضع المراجعة جاهز')">راجع البطاقات</button></div></div>`,library:()=>`<div class="card"><div class="row"><div><h2 style="margin:0">مكتبتك</h2><p class="muted">كل ملفاتك وملخصاتك واختباراتك في مكان واحد.</p></div><button class="glow" onclick="openUpload()">رفع ملف</button></div><input class="input" style="margin-top:18px" placeholder="ابحث داخل مكتبتك..."></div><div class="grid subjects section"><div class="card subject"><span class="symbol">▤</span><h3>ملخص الفيزياء</h3><small class="muted">آخر تحديث اليوم · 24 صفحة</small></div><div class="card subject"><span class="symbol">▧</span><h3>قوانين الرياضيات</h3><small class="muted">ملخص · 8 صفحات</small></div><div class="card subject"><span class="symbol">□</span><h3>ملاحظات المحاضرة</h3><small class="muted">ملاحظات · 3 ملفات</small></div></div>`,quiz:()=>`<div class="card"><span class="muted">اختباراتك</span><h2>اختبر فهمك</h2><p class="muted">اختبارات قصيرة مبنية على دروسك، مع تحليل لأخطائك ونقاط قوتك.</p><div class="actions"><button class="glow" onclick="startQuiz()">اختبار سريع · 5 أسئلة</button><button class="secondary" onclick="toast('يمكنك إنشاء اختبار من أي مادة')">إنشاء اختبار مخصص</button></div></div><div class="grid stats section"><div class="card stat"><span>آخر نتيجة</span><b>84%</b><small style="color:var(--good)">فيزياء</small></div><div class="card stat"><span>اختبارات مكتملة</span><b>24</b><small class="muted">هذا الشهر</small></div><div class="card stat"><span>نقطة تحتاج مراجعة</span><b>3</b><small style="color:var(--warn)">مفاهيم</small></div></div>`,stats:()=>`<div class="grid stats"><div class="card stat"><span>وقت المذاكرة</span><b>18س 40د</b><small class="muted">هذا الشهر</small></div><div class="card stat"><span>الدقة</span><b>84%</b><small style="color:var(--good)">تحسن 8%</small></div><div class="card stat"><span>دروس مكتملة</span><b>41</b><small class="muted">من أصل 58</small></div><div class="card stat"><span>سلسلة الأيام</span><b>7</b><small style="color:var(--warn)">أفضل: 12</small></div></div><div class="card section"><h2>تقدمك خلال الأسبوع</h2><div style="height:170px;display:flex;align-items:end;gap:14px;padding:20px 4%"><i style="height:35%" class="bar"></i><i style="height:65%" class="bar"></i><i style="height:45%" class="bar"></i><i style="height:80%" class="bar"></i><i style="height:72%" class="bar"></i><i style="height:95%" class="bar"></i><i style="height:55%" class="bar"></i></div></div>`,profile:()=>`<div class="card"><div class="row"><div class="row"><div class="avatar" style="width:70px;height:70px;font-size:25px">أ</div><div><h2 style="margin:0">أحمد محمد</h2><span class="muted">الصف الثاني الثانوي · علمي</span></div></div><button class="secondary" onclick="toast('يمكنك تعديل ملفك من الإعدادات')">تعديل الملف</button></div></div><div class="card section list"><div class="row"><b>اللغة</b><button class="secondary" onclick="toggleLang()">العربية</button></div><div class="row"><b>الإشعارات</b><button class="secondary">مفعلة</button></div><div class="row"><b>المظهر</b><button class="secondary">داكن</button></div><div class="row"><b>الخصوصية والأمان</b><span class="muted">›</span></div></div>`};
function openSubject(){S.page='subject';render()}function startFocus(){document.querySelector('#modal').innerHTML=`<div class="modal"><div class="modalbox"><h2>وضع التركيز</h2><p class="muted">رياضيات · حل مسائل التفاضل</p><div class="ring" style="margin:25px auto;width:170px;height:170px"><b>25:00</b></div><button class="glow" style="width:100%" onclick="toast('بدأت جلسة التركيز');closeModal()">ابدأ الجلسة</button></div></div>`}function startQuiz(){toast('تم تجهيز اختبار الفيزياء — 5 أسئلة');}function openHelper(){document.querySelector('#modal').innerHTML=`<div class="modal"><div class="modalbox"><h2>كيف نساعدك؟</h2><p class="muted">اختر ما تريد إنجازه داخل دراستك.</p><div class="grid" style="grid-template-columns:1fr 1fr"><button class="secondary" onclick="toast('افتح درسًا واختر سؤالًا لحله');closeModal()">حل سؤال</button><button class="secondary" onclick="toast('اختر ملفًا من مكتبتك لتلخيصه');closeModal()">لخص درسًا</button><button class="secondary" onclick="toast('اختر مفهومًا لشرحه ببساطة');closeModal()">اشرح لي</button><button class="secondary" onclick="go('quiz');closeModal()">أنشئ اختبارًا</button></div></div></div>`}function openUpload(){document.querySelector('#modal').innerHTML=`<div class="modal"><div class="modalbox"><h2>أضف إلى مكتبتك</h2><p class="muted">ارفع ملفًا دراسيًا أو التقط صورة لصفحة.</p><button class="secondary" style="width:100%;margin:6px 0" onclick="toast('اختيار الملفات يحتاج ربط Storage آمن');closeModal()">اختيار PDF أو صورة</button><button class="secondary" style="width:100%;margin:6px 0" onclick="toast('الكاميرا جاهزة للربط عبر التطبيق الأصلي');closeModal()">فتح الكاميرا</button><small class="muted">التحليل الذكي يحتاج اتصالًا وخدمة Backend. لا توجد مفاتيح داخل التطبيق.</small></div></div>`}function closeModal(){document.querySelector('#modal').innerHTML=''}function toggleLang(){S.lang=S.lang==='ar'?'en':'ar';toast(S.lang==='ar'?'تم التبديل إلى العربية':'Language switched to English');render()}render();
</script></body></html>
