<style>
/* ============ 1. الأساسيات و الهوية البصرية ============ */
:root{
  /* === عائلة الأسود الفاتح (الرمادي الحقيقي محايد، بلا مسحة وردية) === */
  --char:#2B2728; --char-2:#4B4647; --char-3:#6F6A6A; --char-4:#8D8888;
  --char-s:#F3F1F1; --char-s2:#FCFBFB; --char-b:#DAD6D6; --char-b2:#E5E2E2;
  --ink:#2B2728; --ink-2:#4B4647; --muted:#6F6A6A; --muted-2:#777272;
  --bg:#F7F6F6; --surface:#FFFFFF; --surface-2:#FCFBFB; --line:#E5E2E2; --line-2:#F3F1F1;
  --p:#800020; --p-d:#63001A; --p-d2:#480012; --p-s:#FBEAF0; --p-s2:#FDF6F8;
  --acc:#8A6600; --acc-s:#FDF4E3; --warn:#D97706; --warn-s:#FDF3E4;
  --danger:#C2413F; --danger-s:#FBEDEC; --ok:#0F8A57; --info:#4B4647; --info-s:#F3F1F1;
  --r:16px; --r-sm:11px; --r-lg:22px;
  --sh:0 1px 2px rgba(43,39,40,.05), 0 10px 26px -14px rgba(43,39,40,.16);
  --sh-lg:0 24px 60px -24px rgba(30,27,28,.32);
  --ff:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic","Cairo","Tajawal",sans-serif;
  --max:1200px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ff);
  font-size:15px; line-height:1.7; letter-spacing:0;
  overflow-x:hidden;
}
img,svg{max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:var(--p-s)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3,h4{margin:0;line-height:1.35;font-weight:800}
p{margin:0}
.wrap{max-width:var(--max);margin:0 auto;padding:0 18px}
.muted{color:var(--muted)}
.tiny{font-size:12.5px}
.sm{font-size:13.5px}
.b{font-weight:700}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.row.wrapx{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.spacer{flex:1}
.hide{display:none!important}
.gap6{gap:6px}.gap14{gap:14px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}.mt26{margin-top:26px}.mt34{margin-top:34px}
.mb6{margin-bottom:6px}.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}.mb18{margin-bottom:18px}.mb26{margin-bottom:26px}
.nowrap{white-space:nowrap}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:16px 0}

/* ============ 2. الأزرار ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;
  background:#fff;border:1px solid var(--line);color:var(--ink);
  transition:.16s ease; white-space:nowrap; line-height:1.2;
}
.btn:hover{border-color:#E5E2E2;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff;box-shadow:0 8px 20px -12px rgba(128,0,32,.85)}
.btn.primary:hover{background:var(--p-d);border-color:var(--p-d)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:9px 11px}
.btn.ghost:hover{background:#F3F1F1;color:var(--ink)}
.btn.soft{background:var(--p-s);border-color:transparent;color:var(--p-d)}
.btn.soft:hover{background:#F7DDE5}
.btn.danger{background:var(--danger-s);border-color:transparent;color:var(--danger)}
.btn.line-danger{border-color:#EFC7C4;color:var(--danger);background:#fff}
.btn.sm2{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 24px;font-size:15.5px;border-radius:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* ============ 3. الشرائح و الشارات ============ */
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
  background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2);
  transition:.15s;white-space:nowrap
}
.chip:hover{border-color:#DAD6D6}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.p{background:var(--p-s);border-color:#E9C6D2;color:var(--p-d)}
.chip.acc{background:var(--acc-s);border-color:#EDD9A8;color:#8A6600}
.chip.flat{background:var(--surface-2);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:800;line-height:1.5}
.badge.ok{background:#E9F6EF;color:#0A6B44}
.badge.warn{background:var(--warn-s);color:#8A4B05}
.badge.bad{background:var(--danger-s);color:#B3261E}
.badge.info{background:var(--info-s);color:#4B4647}
.badge.p{background:var(--p-s);color:var(--p-d)}
.badge.acc{background:var(--acc-s);color:#8A6600}
.badge.ink{background:#F3F1F1;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.g{background:var(--ok)}.dot.y{background:var(--warn)}.dot.r{background:var(--danger)}
.pulse{position:relative}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);opacity:.7;animation:pl 2s infinite}
@keyframes pl{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.stars{color:#C99700;font-size:13px;letter-spacing:-1px}

/* ============ 4. الهيدر ============ */
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--char-b);
  box-shadow:0 1px 0 rgba(128,0,32,.06);
}
.topbar .inner{display:flex;align-items:center;gap:14px;height:66px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.logo svg{filter:drop-shadow(0 5px 10px rgba(72,0,18,.34))}
.brand b{font-size:19px;font-weight:900;letter-spacing:-.2px}
.brand span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:1.5px;margin-top:-5px}
.nav{display:flex;align-items:center;gap:2px}
.nav a{padding:9px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2)}
.nav a:hover{background:#F7F6F6}
.nav a.on{color:var(--p-d);background:var(--p-s)}
.topbar .searchmini{flex:1;max-width:330px;position:relative}
.topbar .searchmini input{
  width:100%;padding:10px 38px 10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-2);font-size:13.5px;outline:none
}
.topbar .searchmini input:focus{border-color:#E9C6D2;background:#fff}
.topbar .searchmini .ic{position:absolute;inset-inline-start:auto;right:12px;top:9px;color:var(--muted-2);font-size:14px}
.loc-chip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:700;background:#fff;max-width:230px}
.loc-chip:hover{border-color:#DAD6D6;background:var(--surface-2)}
.loc-chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env{font-size:10.5px;font-weight:800;background:var(--warn-s);color:#8A4B05;padding:4px 8px;border-radius:8px}

/* ============ 5. الهيرو ============ */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:
    radial-gradient(900px 380px at 85% -20%, rgba(196,66,104,.42), transparent 70%),
    radial-gradient(700px 340px at 8% 110%, rgba(201,151,0,.20), transparent 70%),
    linear-gradient(165deg,#2A0510 0%,#4A0A1E 55%,#30060F 100%);
  padding:44px 0 40px;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.6),transparent 75%)
}
.hero .inner{position:relative;z-index:2}
.hero h1{font-size:clamp(26px,4.4vw,44px);font-weight:900;line-height:1.28;letter-spacing:-.5px;max-width:790px}
.hero h1 .hl{color:#F6C4D3}
.hero p.sub{margin-top:12px;color:#D5BBC4;font-size:clamp(14px,1.7vw,17px);max-width:640px;font-weight:500}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12)}
.hero-stats b{display:block;font-size:22px;font-weight:900;color:#fff}
.hero-stats span{font-size:12.5px;color:#D2B4BE}
.searchbig{display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:9px;margin-top:24px;max-width:820px;box-shadow:var(--sh-lg)}
.searchbig .f{flex:1;display:flex;align-items:center;gap:10px;padding:0 6px;min-width:0}
.searchbig input{flex:1;border:0;outline:none;font-size:16px;padding:12px 2px;background:transparent;min-width:0}
.searchbig .geo{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:13.5px;color:var(--ink-2);white-space:nowrap;display:flex;gap:6px;align-items:center}
.searchbig .geo:hover{background:#F3F1F1}
.searchbig .go{padding:13px 26px;border-radius:13px;background:var(--p);color:#fff;font-weight:800;font-size:15px}
.searchbig .go:hover{background:var(--p-d)}
.search-hints{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center;color:#D2B4BE;font-size:13px}
.search-hints a{color:#FBE9EF;border-bottom:1px dotted rgba(223,246,238,.5);font-weight:600}
.tryrow{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.tryrow::-webkit-scrollbar{display:none}
.tryrow button{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#FBEAF0;padding:8px 13px;border-radius:999px;font-size:13px;white-space:nowrap;font-weight:600}
.tryrow button:hover{background:rgba(255,255,255,.16)}

/* ============ 6. الأقسام و الكروت ============ */
.sec{padding:30px 0 6px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
.sec-head h2{font-size:21px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center}
.sec-head h2::before{content:"";width:5px;height:15px;border-radius:3px;background:var(--char);margin-inline-end:9px;flex:0 0 auto}
.sec-head p{font-size:13.5px;color:var(--muted);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:18px}
.card.hv{transition:.18s}
.card.hv:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(43,39,40,.045),0 22px 40px -22px rgba(43,39,40,.28);border-color:#E5E2E2}
.cat{
  display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px;border-radius:var(--r);
  background:#fff;border:1px solid var(--line);transition:.16s;text-align:center
}
.cat:hover{border-color:#E9C6D2;background:var(--p-s2);transform:translateY(-3px)}
.cat .ic{font-size:26px;line-height:1}
.cat .nm{font-size:13px;font-weight:700}
.cat .ct{font-size:11px;color:var(--muted-2)}
.grid{display:grid;gap:14px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g-cats{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g-4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g-side{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
@media(max-width:900px){.g-side{grid-template-columns:1fr}}

.thumb{
  width:52px;height:52px;border-radius:13px;display:grid;place-items:center;font-size:25px;flex:0 0 auto;
  background:linear-gradient(150deg,#F7F6F6,#EDEBEB);border:1px solid var(--line)
}
.thumb.lg{width:76px;height:76px;font-size:38px;border-radius:18px}
.thumb.xl{width:100%;height:170px;font-size:64px;border-radius:14px}
.store-card{padding:16px}
.store-card h3{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.vf{color:var(--p);font-size:14px}
.priceline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{font-size:20px;font-weight:900;letter-spacing:-.4px}
.price.big{font-size:30px}
.price-old{color:var(--muted-2);text-decoration:line-through;font-size:13.5px}
.cur{font-size:12.5px;font-weight:700;color:var(--muted)}
.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.kv .k{display:flex;align-items:center;gap:5px}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ribbon{position:absolute;inset-inline-start:14px;top:-10px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px;box-shadow:0 8px 16px -8px rgba(181,137,0,.85)}
.rel{position:relative}
.best{border-color:#E7C9D3;background:linear-gradient(180deg,#FDF7F9,#fff 60%)}
.best-tag{background:var(--p);color:#fff;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px}

/* ============ 7. تحليل الطلب و الملخص ============ */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.dark{background:linear-gradient(160deg,#2C0611,#470A1C);border-color:transparent;color:#fff}
.panel.dark .muted,.panel.dark .meta{color:#D2B4BE}
.panel.dark .stat{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--line-2);border-radius:13px;padding:12px 13px}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .v{font-size:19px;font-weight:900;margin-top:3px;letter-spacing:-.3px}
.stat .s{font-size:11.5px;color:var(--muted-2)}
.insight{display:flex;gap:11px;padding:13px;border-radius:13px;background:var(--p-s2);border:1px solid #F0DAE1}
.insight .ic{font-size:19px}
.insight.warn{background:var(--warn-s);border-color:#F0DFC0}
.insight.bad{background:var(--danger-s);border-color:#F2D3D2}
.insight.info{background:var(--info-s);border-color:#E5E2E2}
.progress{height:7px;border-radius:99px;background:#EDEBEB;overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--p)}
.progress i.w{background:var(--warn)}.progress i.r{background:var(--danger)}
.parsed{display:flex;gap:8px;flex-wrap:wrap}
.pf{background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 11px;font-size:12.5px}
.pf b{font-weight:800}
.pf .lbl{color:var(--muted-2);font-size:11px;display:block;line-height:1.3}

/* ============ 8. الجداول ============ */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
table.tbl th{
  text-align:right;font-size:12px;font-weight:800;color:#fff;padding:12px 14px;
  background:linear-gradient(180deg,#373233,#2B2728);border-bottom:1px solid #1F1C1D;white-space:nowrap;position:sticky;top:0
}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:#FCFBFB}
table.tbl tr.win{background:linear-gradient(90deg,var(--p-s2),transparent)}
table.tbl tr.win td:first-child{box-shadow:inset 3px 0 0 var(--p)}
.td-store{display:flex;align-items:center;gap:10px;min-width:190px}

/* ============ 9. التبويبات و الفلاتر ============ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;font-size:14px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--p-d);border-color:var(--p)}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.input,.select,textarea.input{
  padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;outline:none;width:100%
}
.input:focus,.select:focus,textarea.input:focus{border-color:#D9A9B8;box-shadow:0 0 0 3px rgba(128,0,32,.13)}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(0% + 16px) 50%,calc(0% + 21px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-start:34px}
.switch{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.switch input{appearance:none;width:40px;height:23px;border-radius:99px;background:#E5E2E2;position:relative;transition:.2s;outline:none;flex:0 0 auto}
.switch input:checked{background:var(--p)}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked::after{inset-inline-start:20px}
.range{-webkit-appearance:none;width:100%;height:24px;background:transparent}
.range::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:#EDEBEB}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--p);margin-top:-7px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.range::-moz-range-track{height:6px;border-radius:99px;background:#EDEBEB}
.range::-moz-range-thumb{width:18px;height:18px;border:5px solid var(--p);background:#fff;border-radius:50%}

/* ============ 10. الخرائط ============ */
.mapbox{position:relative;background:
  radial-gradient(600px 300px at 70% 0%, #F8F0F2, transparent),
  linear-gradient(#FCFBFB,#EDEBEB);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.map-svg{display:block;width:100%;height:auto;touch-action:none}
.map-legend{position:absolute;inset-inline-start:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:11.5px;display:flex;flex-direction:column;gap:5px;backdrop-filter:blur(6px)}
.map-tools{position:absolute;inset-inline-end:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.map-tools button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.95);border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
.map-tools button:hover{background:#fff;border-color:#DAD6D6}
.pin{cursor:pointer;transition:.15s}
.pin:hover{transform:translateY(-3px)}
.pin .lbl{font-size:11px;font-weight:800;fill:var(--ink-2);paint-order:stroke;stroke:#fff;stroke-width:3px}
.map-pop{
  position:absolute;min-width:230px;max-width:290px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:13px;box-shadow:var(--sh-lg);z-index:5
}
.map-pop::after{content:"";position:absolute;bottom:-7px;inset-inline-start:26px;width:12px;height:12px;background:#fff;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.ring-lbl{font-size:9.5px;fill:#8D8888;font-weight:700}
.nile{fill:none;stroke:#A3AEB6;stroke-width:2.4;stroke-linejoin:round;opacity:.85}
.eg-land{fill:#F7F5F5;stroke:#ADA7A7;stroke-width:1.3}
.eg-sea{fill:#DCDADA}

/* ============ 11. الرسوم البيانية ============ */
.spark{display:block;width:100%;height:auto}
.bars{display:flex;align-items:flex-end;gap:4px;height:92px}
.bars i{flex:1;background:linear-gradient(180deg,#C4567C,var(--p));border-radius:6px 6px 3px 3px;min-height:3px;position:relative;transition:.3s}
.bars i:hover{background:linear-gradient(180deg,#D98CA8,var(--p-d))}
.bars i span{position:absolute;bottom:-19px;inset-inline:0;text-align:center;font-size:10px;color:var(--muted-2);font-weight:700}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12.5px}
.hbar .tr{grid-column:1/-1;height:8px;background:#EDEBEB;border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--p);border-radius:99px}

/* ============ 12. المودال و التوست ============ */
.backdrop{position:fixed;inset:0;background:rgba(43,39,40,.52);backdrop-filter:blur(3px);z-index:200;display:grid;place-items:center;padding:18px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--r-lg);max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--sh-lg);animation:pop .2s}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal.wide{max-width:860px}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
.modal-body{padding:20px}
.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;background:var(--surface-2);position:sticky;bottom:0}
.x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.x:hover{background:#F7F6F6;color:var(--ink)}
#toasts{position:fixed;inset-inline-start:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:min(360px,86vw)}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:13px 15px;font-size:13.5px;box-shadow:var(--sh-lg);display:flex;gap:10px;animation:slidein .22s}
.toast.ok{background:linear-gradient(140deg,#63001A,#4A0013)}
.toast.warn{background:linear-gradient(140deg,#A8790A,#6E5200)}
@keyframes slidein{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* ============ 13. التقييم و التفاصيل ============ */
.review{border:1px solid var(--line);border-radius:14px;padding:14px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--p-s);color:var(--p-d);font-weight:800}
.timeline{position:relative;padding-inline-start:22px}
.timeline::before{content:"";position:absolute;inset-inline-start:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;inset-inline-start:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--p)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gallery .g{aspect-ratio:4/3;border-radius:13px;display:grid;place-items:center;font-size:34px;background:linear-gradient(150deg,#F7F6F6,#EDEBEB);border:1px solid var(--line)}
.info-list{display:flex;flex-direction:column;gap:11px}
.info-item{display:flex;gap:11px;align-items:flex-start;font-size:13.5px}
.info-item .ic{font-size:16px;width:22px;text-align:center;flex:0 0 auto;opacity:.85}
.hours{display:flex;flex-direction:column;gap:6px;font-size:13px}
.hours .d{display:flex;justify-content:space-between;padding:5px 9px;border-radius:9px}
.hours .d.today{background:var(--p-s);font-weight:800;color:var(--p-d)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-size:25px;font-weight:900;letter-spacing:-.6px;margin-top:2px}
.kpi .d{font-size:11.5px;font-weight:700}

/* ============ 14. التنقل السفلي ============ */
.bottomnav{
  display:none;position:fixed;inset-inline:0;bottom:0;z-index:70;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--char-b);padding:6px 4px 8px;
  box-shadow:0 -8px 24px -18px rgba(43,39,40,.52)
}
.bottomnav .in{display:grid;grid-template-columns:repeat(5,1fr)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--muted)}
.bottomnav a .ic{font-size:19px}
.bottomnav a.on{color:var(--p-d);background:var(--p-s)}

/* ============ 15-ب. المحلات الحقيقية (OpenStreetMap) ============ */
.real-panel{border:1px solid #E9C6D2;background:linear-gradient(180deg,#FFFFFF,#FDF7F9)}
.real-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:12px;padding:11px 13px;font-size:13px;font-weight:600;line-height:1.65}
.real-status.idle{background:#F7F6F6;border:1px dashed #DAD6D6;color:#4B4647}
.real-status.load{background:#FDF4E3;border:1px solid #EDD9A8;color:#8A6600}
.real-status.ok{background:#E9F6EF;border:1px solid #CFEADF;color:#0A6B44}
.real-status.bad{background:#FBEDEC;border:1px solid #F2D3D2;color:#B3261E;display:block}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(43,39,40,.16);border-top-color:currentColor;display:inline-block;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.real-cta{border:1px solid #E9C6D2;background:linear-gradient(160deg,#FDF7F9,#FFFFFF)}
.real-card{border-color:#E9C6D2}
.real-card .real-ribbon{background:var(--char)}
.real-noprice{background:#FCFBFB;border:1px dashed #DAD6D6;border-radius:12px;padding:12px}
.real-price{background:#FDF7F9;border:1px solid #F2DCE3;border-radius:12px;padding:12px}
.real-strip{border:1px solid #E9C6D2;background:linear-gradient(180deg,#FDF7F9,#FFFFFF)}
.real-pin{cursor:pointer}
.real-pin:hover circle{stroke-width:4}
.logo svg{width:100%;height:100%;display:block;border-radius:inherit}

/* ============ 15. الفوتر ============ */
footer.site{background:linear-gradient(180deg,#2B2728,#221F20);color:#B0ABAB;margin-top:44px;padding:34px 0 90px;border-top:3px solid var(--p)}
footer.site h4{color:#fff;font-size:14px;margin-bottom:10px}
footer.site a{display:block;padding:3px 0;font-size:13px;color:#B0ABAB}
footer.site a:hover{color:#fff}
.fgrid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:24px}
@media(max-width:760px){.fgrid{grid-template-columns:1fr 1fr}}
.fbottom{border-top:1px solid rgba(255,255,255,.1);margin-top:24px;padding-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px}

/* ============ 16. الاستجابة ============ */
@media(max-width:1250px){ .nav a{padding:8px 9px;font-size:13px} .loc-chip{max-width:180px} }
@media(max-width:1040px){
  .nav{display:none}
  .topbar .searchmini{max-width:none}
}
@media(max-width:860px){
  body{font-size:14.5px}
  .bottomnav{display:block}
  .topbar .inner{height:60px;gap:10px}
  .loc-chip{max-width:150px;font-size:12px;padding:7px 10px}
  .searchbig{flex-direction:column;align-items:stretch;gap:8px;padding:10px}
  .searchbig .go{width:100%}
  .searchbig .geo{justify-content:center}
  .hero{padding:30px 0 30px}
  .sec{padding:22px 0 4px}
  .g-auto{grid-template-columns:1fr}
  .g-cats{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .modal{max-height:94vh}
  .stats{grid-template-columns:1fr 1fr}
  #toasts{inset-inline:12px;bottom:82px}
}
@media(max-width:420px){
  .g-cats{grid-template-columns:repeat(3,1fr)}
  .thumb.xl{height:140px}
}
.skel{background:linear-gradient(90deg,#F3F1F1 25%,#F7F6F6 37%,#F3F1F1 63%);background-size:400% 100%;animation:sk 1.2s infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.noscroll{overflow:hidden}
/* ============ 17. وحدة تسجيل المحلات ============ */
.steps-vert{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.steps-vert::-webkit-scrollbar{display:none}
.stepi{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line-2);font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;transition:.15s}
.stepi .num{width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;flex:0 0 auto}

/* ---------- تطبيع النص العربي: إزالة التشكيل وتوحيد الحروف ---------- */
const AR_MAP = { 'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ٱ': 'ا', 'ى': 'ي', 'ئ': 'ي', 'ؤ': 'و', 'ة': 'ه', 'گ': 'ك', 'ک': 'ك', 'ی': 'ي', 'ﻻ': 'لا' };
function norm(s) {
  return String(s || '')
    .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
    .replace(/[أإآٱىئؤةگکیﻻ]/g, c => AR_MAP[c] || c)
    .replace(/[^\w\u0600-\u06FF\s]/g, ' ')
    .replace(/\s+/g, ' ').trim().toLowerCase();
}
const STOP = new Set(['في', 'من', 'على', 'عن', 'عايز', 'عاوز', 'اريد', 'أريد', 'محتاج', 'ممكن', 'هات', 'لي', 'عندي', 'بحوالي', 'جنيه', 'جنية', 'جنيها', 'ال', 'و', 'او', 'أو', 'جدا', 'كمان', 'قريب', 'قريبة', 'مني', 'لحد', 'حتى', 'اقل', 'أقل', 'اكثر', 'أكثر']);
const AR_DIGITS = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9' };
const fixDigits = (s) => String(s).replace(/[٠-٩]/g, d => AR_DIGITS[d]);

/* ---------- البحث عن منتج: مطابقة بالمعرّف أو الماركة أو الكلمات ---------- */
function findProduct(q) {
  const n = norm(q);
  if (!n) return null;
  const toks = n.split(' ').filter(t => t.length > 1 && !STOP.has(t));
  let best = null, bestScore = 0;
  PRODUCTS.forEach(p => {
    const hay = norm(p.name + ' ' + p.brand + ' ' + p.kw + ' ' + p.cat + ' ' + catOf(p.cat).ar);
    let sc = 0;
    if (n.includes(norm(p.id))) sc += 6;
    if (p.kw.split(' ').some(k => k.length > 2 && n.includes(norm(k)))) sc += 5;
    if (n.includes(norm(p.brand))) sc += 3;
    toks.forEach(t => { if (hay.includes(t)) sc += 2.2; });
    const pn = norm(p.name).split(' ');
    if (pn.filter(t => t.length > 2 && n.includes(t)).length >= 2) sc += 3.5;
    if (sc > bestScore) { bestScore = sc; best = p; }
  });
  return bestScore >= 4 ? best : null;
}
function findCategory(q) {
  const n = norm(q);
  let hit = null, len = 0;
  CATS.forEach(c => {
    const words = [c.id, c.ar, ...(c.ar.split(' '))].map(norm).filter(w => w.length > 2);
    words.forEach(w => {
      if (n.includes(w) || w.includes(n)) {
        const score = w.length + (n === w ? 5 : 0);
        if (score > len) { len = score; hit = c; }
      }
    });
  });
  // كلمات شعبية إضافية
  const extra = [
    ['موبايل', 'mobile'], ['تليفون', 'mobile'], ['هاتف', 'mobile'], ['تابلت', 'mobile'], ['ساعه', 'mobile'],
    ['لاب توب', 'computer'], ['لابتوب', 'computer'], ['كمبيوتر', 'computer'], ['رام', 'computer'], ['هارد', 'computer'], ['كارت', 'computer'],
    ['سماعه', 'audio'], ['هيدفون', 'audio'], ['اسبيكر', 'audio'], ['مكبر', 'audio'],
    ['شاشه', 'electronics'], ['راوتر', 'electronics'], ['ماوس', 'electronics'], ['باور', 'electronics'],
    ['بلايستيشن', 'gaming'], ['اكس بوكس', 'gaming'], ['لعبه', 'gaming'],
    ['حله', 'home'], ['قلايه', 'home'], ['مكنسه', 'home'], ['مروحه', 'home'], ['اثاث', 'home'],
    ['قميص', 'clothing'], ['بنطلون', 'clothing'], ['تيشيرت', 'clothing'], ['فستان', 'clothing'], ['ملابس', 'clothing'],
    ['جزمة', 'shoes'], ['حزاء', 'shoes'], ['احذيه', 'shoes'], ['سنيكرز', 'shoes'],
    ['عطر', 'beauty'], ['كريم', 'beauty'], ['ميكب', 'beauty'], ['شامبو', 'beauty'],
    ['بقاله', 'supermarket'], ['سوبر', 'supermarket'], ['زيت', 'supermarket'], ['ارز', 'supermarket'],
    ['كتاب', 'books'], ['مكتبه', 'books'], ['روايه', 'books'],
    ['شنيور', 'tools'], ['مفك', 'tools'], ['سلم', 'tools'], ['ادوات', 'tools'],
    ['مطعم', 'restaurant'], ['وجبه', 'restaurant'], ['بيتزا', 'restaurant'], ['كريب', 'restaurant'],
    ['صيدليه', 'pharmacy'], ['دوا', 'pharmacy'], ['فيتامين', 'pharmacy'],
    ['سياره', 'auto'], ['كاوتش', 'auto'], ['زيت موتور', 'auto'],
    ['دمبل', 'sports'], ['جيم', 'sports'], ['رياضه', 'sports']
  ];
  extra.forEach(([w, cid]) => { if (n.includes(norm(w)) && w.length > len) { len = w.length; hit = catOf(cid); } });
  return hit;
}
const BRANDS = Array.from(new Set(PRODUCTS.map(p => p.brand)).values()).filter(b => b !== 'محلي' && b !== 'مطعم' && b !== 'مكتبة' && b !== 'صيدلية');
function findBrand(q) { const n = norm(q); return BRANDS.find(b => n.includes(norm(b))) || null; }

/* ---------- تحويل الجملة الطبيعية إلى فلاتر ----------
   مثال: "عايز سماعة JBL تحت 3000 جنيه قريبة مني"
   → {cat:audio, brand:JBL, max:3000, near:true, ...}
------------------------------------------------------------- */
function parseQuery(q) {
  const raw = fixDigits(q || '');
  const n = norm(raw);
  const p = {
    q: raw, tokens: n.split(' ').filter(t => t && !STOP.has(t)),
    cat: null, brand: null, product: null, max: null, min: null, near: false, openNow: false,
    cheap: false, best: false, discountMin: 0, radiusK: null, used: false, unknown: true, stores: [], notes: []
  };

  /* الميزانية القصوى */
  let m = raw.match(/(?:أقل|اقل|تحت|بأقل|بحد أقصى|حد اقصى|ميزانية|معايا|عندي|لحد|حتى|في حدود|بحدود)\s*(\d[\d,\.]*)\s*(?:الف|ألف|ف)?/);
  if (!m) m = raw.match(/(\d[\d,\.]*)\s*(?:جنيه|جنية|ج\.م|EGP|egp)/);
  if (m) { let v = parseFloat(m[1].replace(/[,\s]/g, '')); if (/الف|ألف/.test(m[0])) v *= 1000; if (v > 150) p.max = v; }
  let m2 = raw.match(/(?:أكثر من|اكثر من|فوق|أعلى من|اعلى من|يبدأ من|من غير أقل من)\s*(\d[\d,\.]*)\s*(?:الف|ألف|ف)?/);
  if (m2) { let v = parseFloat(m2[1].replace(/[,\s]/g, '')); if (/الف|ألف/.test(m2[0]) || v < 500) v *= 1000; p.min = v; }
  if (!p.max) { const mm = n.match(/(\d{2,4})\s*(?:الف|ألف)/); if (mm) p.max = parseFloat(mm[1]) * 1000; }

  /* النطاق الجغرافي المذكور في الجملة */
  const rm = n.match(/(\d+(?:[.,]\d+)?)\s*(?:كم|كيلو|كيلومتر)/);
  if (rm) p.radiusK = parseFloat(rm[1].replace(',', '.'));
  else { const mm2 = n.match(/(\d{3,5})\s*(?:متر|م)\s*(?:مني|من موقعي|حولي)?/); if (mm2) p.radiusK = parseFloat(mm2[1]) / 1000; }

  /* نية الطلب */
  if (/(قريب|جنبي|حوالي|حولي|نفس المنطقة|قريبة مني|قريب مني|بجانبي|بالقرب|جمبي)/.test(n)) p.near = true;
  if (/(مفتوح|فاتح|شغال|الان|دلوقتي|يعمل حاليا|مفتوحه)/.test(n)) p.openNow = true;
  if (/(ارخص|رخيص|اقل سعر|افضل سعر|باقل|توفير)/.test(n)) p.cheap = true;
  if (/(افضل|احسن|كويس|جوده|ممتاز)/.test(n)) p.best = true;
  const dm = n.match(/(\d+)\s*(?:%|في الميه|بالميه)\s*(?:خصم)?/);
  if (dm) p.discountMin = parseFloat(dm[1]);

  /* المحافظة أو المنطقة */
  const cities = Array.from(new Set(DB.stores.map(s => s.city)));
  const areas = Array.from(new Set(DB.stores.map(s => s.area)));
  p.city = cities.find(c => n.includes(norm(c))) || null;
  p.area = areas.find(a => n.includes(norm(a))) || null;

  /* المتاجر المذكورة بالاسم */
  p.stores = DB.stores.filter(st => {
    const sn = norm(st.name);
    return sn.length > 5 && (n.includes(sn) || (n.length > 5 && sn.includes(n)));
  });

  /* التمييز بين «منتج محدد» و«قسم عام»: «محلات أحذية» تعني القسم لا منتجًا واحدًا */
  const generic = /(محل|محلات|متجر|متاجر|اماكن|مكان|انواع|نوع|ستور|شوب|store|market|توكيل|موزع)/.test(n);
  const WEAK = ['رجالي', 'حريمي', 'نسائي', 'ولادي', 'اطفالي', 'قطن', 'كلاسيك', 'جديد', 'اصلي', 'رخيص', 'غالي', 'محل', 'محلات', 'متجر', 'متاجر', 'سعر', 'اسعار', 'افضل', 'احسن', 'مفتوح', 'مفتوحه', 'يبيع', 'بتاع', 'مناسب'];
  const catHit = findCategory(raw);
  const prodHit = findProduct(raw);
  if (generic && catHit) {
    const strong = p.tokens.filter(t => t.length > 2 && WEAK.indexOf(t) < 0);
    const specific = prodHit && strong.some(t => norm(prodHit.name + ' ' + prodHit.brand).includes(t));
    if (!specific) { p.cat = catHit; p.product = null; p.notes.push('general'); }
    else { p.product = prodHit; p.cat = catOf(prodHit.cat); }
  } else { p.product = prodHit; p.cat = prodHit ? catOf(prodHit.cat) : catHit; }
  p.brand = findBrand(raw);
  if (p.product && p.notes.indexOf('general') < 0 && (p.brand || p.max)) {
    // التأكد أن الماركة المذكورة تطابق المنتج
    if (p.brand && norm(p.product.brand) !== norm(p.brand)) {
      const alt = PRODUCTS.filter(x => norm(x.brand) === norm(p.brand) && (!p.cat || x.cat === p.product.cat));
      if (alt.length) p.product = alt[0];
    }
  }

  /* لو المنتج المحدد خارج الميزانية ⇒ نعرض بدائل داخل نفس القسم */
  if (p.product && p.max != null) {
    const ls = DB.byProduct[p.product.id] || [];
    const mn = ls.length ? Math.min.apply(null, ls.map(l => l.price)) : p.product.base;
    if (mn > p.max) {
      p.productNamed = p.product.name; p.productNamedMin = mn;
      p.cat = catOf(p.product.cat); p.product = null; p.notes.push('over-budget');
    }
  }

  p.used = !!(p.product || p.cat || p.brand) || p.max != null || p.near || p.openNow || p.discountMin > 0 || p.stores.length > 0;
  p.unknown = !(p.product || p.cat || p.brand) && p.max == null && !p.near && !p.openNow && !p.discountMin && !p.stores.length;
  return p;
}

/* ---------- محرك البحث الرئيسي ---------- */
function searchListings(q, opt) {
  opt = opt || {};
  const parsed = parseQuery(q);
  const center = opt.center || LOC;
  let rows = DB.listings.slice();

  // الفلترة
  if (parsed.product && !opt.ignoreProduct) rows = rows.filter(l => l.productId === parsed.product.id);
  else if (parsed.cat) rows = rows.filter(l => l.cat === parsed.cat.id);
  if (parsed.brand) rows = rows.filter(l => norm(l.brand) === norm(parsed.brand));
  if (parsed.max != null) rows = rows.filter(l => l.price <= parsed.max);
  if (parsed.min != null) rows = rows.filter(l => l.price >= parsed.min);
  if (parsed.discountMin) rows = rows.filter(l => l.disc >= parsed.discountMin);
  if (opt.cat) rows = rows.filter(l => l.cat === opt.cat);
  if (opt.city) rows = rows.filter(l => DB.stores.find(s => s.id === l.storeId).city === opt.city);
  if (opt.inStock) rows = rows.filter(l => l.inStock);
  if (opt.onlyOffers) rows = rows.filter(l => l.disc > 0);

  // المسافة والحالة
  rows = rows.map(l => {
    const st = DB.stores.find(s => s.id === l.storeId);
    return Object.assign({}, l, { st, dist: distKm(center, st), open: isOpen(st) });
  });
  const rk = opt.maxDist || parsed.radiusK || 0;
  if (rk) rows = rows.filter(r => r.dist <= rk);
  if (opt.openNow || parsed.openNow) rows = rows.filter(r => r.open);

  /* لا يوجد للسعر المحدد نتيجة؟ نوسّع للقسم نفسه بنفس الشروط ونوضح ذلك للمستخدم */
  let fallback = false;
  if (!rows.length && parsed.product && (parsed.max != null || opt.maxDist || parsed.radiusK)) {
    const backup = DB.listings.filter(l => l.cat === parsed.product.cat).map(l => {
      const st = DB.stores.find(s => s.id === l.storeId);
      return Object.assign({}, l, { st, dist: distKm(center, st), open: isOpen(st) });
    }).filter(l => l.price <= (parsed.max != null ? parsed.max : Infinity))
      .filter(l => !rk || l.dist <= rk)
      .filter(l => !opt.inStock || l.inStock)
      .filter(l => !(opt.openNow || parsed.openNow) || l.open);
    if (backup.length) { rows = backup; fallback = true; }
  }

  // الترتيب
  const sort = opt.sort || (parsed.cheap ? 'price' : parsed.near ? 'dist' : (parsed.product ? 'total' : 'total'));
  if (sort === 'total') {
    const prices = rows.map(x => x.price);
    const mn = Math.min.apply(null, prices.concat([0])), mx = Math.max.apply(null, prices.concat([0]));
    rows.sort((a, b) => scoreRow(b, mn, mx) - scoreRow(a, mn, mx) || a.price - b.price);
  } else {
    rows.sort((a, b) => {
      if (sort === 'price') return a.price - b.price || a.dist - b.dist;
      if (sort === 'dist') return a.dist - b.dist || a.price - b.price;
      if (sort === 'disc') return b.disc - a.disc || a.price - b.price;
      if (sort === 'rating') return b.st.rating - a.st.rating || a.price - b.price;
      if (sort === 'fresh') return a.updatedH - b.updatedH;
      return a.price - b.price;
    });
  }
  return { rows, parsed, total: rows.length, fallback, radiusK: rk };
}
function scoreRow(r, mn, mx) {
  const sp = mx === mn ? 1 : 1 - (r.price - mn) / (mx - mn);          // 1 = الأرخص
  const sd = 1 / (1 + r.dist / 3);                                      // القرب
  const sdisc = clamp(r.disc / 30, 0, 1);                               // الخصم
  const srate = (r.st.rating - 3.2) / 1.8;                              // التقييم
  const sfresh = r.updatedH < 24 ? 1 : r.updatedH < 96 ? 0.6 : 0.2;     // حداثة السعر
  const sstock = r.inStock ? 1 : 0;
  return sp * .34 + sd * .24 + sdisc * .14 + srate * .12 + sfresh * .08 + sstock * .08;
}

/* ---------- محرك التحليل: ملخص وصفي بالأرقام ---------- */
function analyze(rows, mode) {
  mode = mode || 'product';
  if (!rows.length) return null;
  const prices = rows.map(r => r.price);
  const mn = Math.min.apply(null, prices), mx = Math.max.apply(null, prices);
  const avg = prices.reduce((a, b) => a + b, 0) / prices.length;
  const near = rows.reduce((a, b) => a.dist < b.dist ? a : b);
  const offer = rows.reduce((a, b) => (b.disc > a.disc ? b : a), rows[0]);
  const fresh = rows.filter(r => r.updatedH < 24).length;
  const stale = rows.filter(r => r.updatedH >= 168).length;
  const openN = rows.filter(r => r.open).length;
  const inStock = rows.filter(r => r.inStock).length;
  const saving = Math.round(mx - mn);
  const savePct = mx ? Math.round((mx - mn) / mx * 100) : 0;
  const avgRating = rows.reduce((a, b) => a + b.st.rating, 0) / rows.length;
  const stores = new Set(rows.map(r => r.storeId)).size;
  const cities = Array.from(new Set(rows.map(r => r.st.city)));
  return {
    n: rows.length, stores, mn, mx, avg: Math.round(avg), saving, savePct, near, offer,
    fresh, stale, openN, inStock, avgRating, cities,
    text: (mode === 'store'
      ? `يوجد ${rows.length} سعرًا مسجّلًا في ${stores} متجرًا${cities.length > 1 ? ' داخل ' + cities.length + ' محافظة' : ''}. ` +
        `أقل سعر مسجّل ${egp(mn)} وأعلى سعر ${egp(mx)} حسب المنتج والمتجر. ` +
        `أقرب متجر ${kmTxt(near.dist)} في ${near.st.area}. ` +
        (offer.disc ? `أكبر خصم معلن ${pct(offer.disc)} عند ${offer.st.name}. ` : '') +
        `يوجد ${openN} متجر مفتوح الآن، وأسعار ${fresh} سعرًا محدثة خلال 24 ساعة${stale ? `، و${stale} سعرًا يحتاج تحديثًا` : ''}.`
      :
      `المنتج متوفر في ${stores} متجر مسجّل${cities.length > 1 ? ' في ' + cities.length + ' محافظة' : ''}. ` +
      `أقل سعر مسجّل ${egp(mn)}، وأعلى سعر ${egp(mx)} — فرق ${egp(saving)} (${pct(savePct)}). ` +
      `أقرب متجر ${kmTxt(near.dist)} في ${near.st.area}. ` +
      (offer.disc ? `أكبر خصم معلن ${pct(offer.disc)} عند ${offer.st.name}. ` : 'لا توجد خصومات مسجلة حاليًا. ') +
      `يوجد ${openN} متجر مفتوح الآن، و${inStock} منهم أكدوا التوفر. ` +
      `أسعار ${fresh} متجر محدثة خلال 24 ساعة${stale ? `، و${stale} متجر يحتاج تحديث السعر` : ''}.`)
  };
}

const TRUST = [
  { max: 24, lvl: 'fresh', ar: 'حديثة', cls: 'ok', dot: 'g', pctv: 100 },
  { max: 96, lvl: 'ok', ar: 'مقبولة', cls: 'p', dot: 'g', pctv: 75 },
  { max: 240, lvl: 'warn', ar: 'تحتاج تحديث', cls: 'warn', dot: 'y', pctv: 45 },
  { max: 1e9, lvl: 'old', ar: 'قديمة', cls: 'bad', dot: 'r', pctv: 18 }
];

/* ---------- تاريخ الأسعار (آخر 12 شهرًا) ---------- */
function priceHistory(pid) {
  const p = PRODUCTS.find(x => x.id === pid);
  if (!p) return [];
  const months = ['أكتوبر', 'نوفمبر', 'ديسمبر', 'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر'];
  const out = [];
  let v = p.base * rng('h' + pid, 1.06, 1.16);
  months.forEach((mn, i) => {
    const drift = rng('h' + pid + i, -0.035, 0.02);
    v = v * (1 + drift);
    out.push({ m: mn, v: round(v, p.base > 3000 ? 50 : 5) });
  });
  const live = DB.byProduct[pid] || [];
  if (live.length) out[out.length - 1].v = Math.min.apply(null, live.map(l => l.price));
  return out;
}
/* سلسلة يومية لأي متجر/منتج (لعرض الاتجاه) */
function daySeries(seed, base, days, vol) {
  let v = base * (1 + (rnd(seed + 'ds') - .5) * vol);
  return Array.from({ length: days }, (_, i) => {
    v = v * (1 + (rnd(seed + 'd' + i) - .5) * vol / 2);
    return Math.round(v);
  });
}

    if (rows.length) hits.push({ alert: a, best: rows.sort((x, y) => x.price - y.price)[0], count: rows.length });
  });
  return hits;
}

function afterRender(page) {
  bindGlobal();
  bindRealSearch();   // أزرار البحث الحقيقي في أي صفحة تحتويها
  if (page === 'home') { drawEgyptMap(); bindLiveParse(); }
  if (page === 'search') bindResults();
  if (page === 'nearby') bindNearby();
  if (page === 'product') bindProduct();
  if (page === 'store') bindStorePage();
  if (page === 'offers') bindOffers();
  if (page === 'favorites') bindFavorites();
  if (page === 'dashboard') bindDashboard();
  if (page === 'admin') bindAdmin();
  if (page === 'assistant') bindAssistant();
  if (page === 'account') bindAccount();
  if (page === 'stores') bindStoresPage();
  if (page === 'addstore') bindRegister();
  if (page === 'directory') bindDirectory();
}
function bindGlobal() {
  const ms = $('#miniSearch');
  if (ms) {
    ms.onkeydown = e => { if (e.key === 'Enter' && ms.value.trim()) go('search', { q: ms.value.trim() }); };
  }
  const lb = $('#locBtn'); if (lb) lb.onclick = openLocation;
  const fb = $('#favBtn'); if (fb) fb.onclick = () => go('favorites');
  const lg = $('#loginBtn'); if (lg) lg.onclick = openLogin;
  const ub = $('#userBtn'); if (ub) ub.onclick = () => go('account');
  const adb = $('#addStoreBtn'); if (adb) adb.onclick = (e) => { e.preventDefault(); regBlankReset(false); go('addstore', { step: 1 }); };
  const ti = $('#trustInfo'); if (ti) ti.onclick = trustModal;
  const eb = $('#envBadge'); if (eb) eb.onclick = demoModal;

  document.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      const act = b.dataset.act, sid = b.dataset.store, pid = b.dataset.prod;
      if (act === 'wa') {
        const st = DB.stores.find(s => s.id === sid), p = PRODUCTS.find(x => x.id === pid);
        const l = (DB.byProduct[pid] || []).find(x => x.storeId === sid);
        const txt = `السلام عليكم، وصلت لكم من تطبيق سوقي.\nبسأل عن: ${p ? p.name : ''}\nالسعر المسجّل على المنصة: ${l ? nf(l.price) + ' ج.م' : '—'}\nهل متوفر حاليًا؟`;
        st.clicksWa++; save('db-touch', 1);
        toast(`تم فتح محادثة واتساب مع ${st.name}`, 'ok', '💬');
        window.open(waLink(st.whatsapp, txt), '_blank');
      }
      if (act === 'call') {
        const st = DB.stores.find(s => s.id === sid); st.calls++;
        toast(`جارٍ الاتصال بـ ${st.name} — ${st.phone}`, 'ok', '☎️');
      }
      if (act === 'dirs') {
        const st = DB.stores.find(s => s.id === sid);
        toast('تم فتح الاتجاهات في تطبيق الخرائط', 'ok', '🧭');
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${st.lat},${st.lon}`, '_blank');
      }
      if (act === 'fav-store') favStore(sid);
      if (act === 'fav-product') { e.stopPropagation(); favProduct(pid); }
      if (act === 'alert') openAlertModal(pid);
      if (act === 'report') openReportModal(sid, pid);
    };
  });
  document.querySelectorAll('a[href^="#/store/"]').forEach(a => {
    a.onclick = (e) => { e.stopPropagation(); };
  });
}
function favStore(id) {
  const i = APP.fav.stores.indexOf(id);
  if (i >= 0) APP.fav.stores.splice(i, 1); else APP.fav.stores.push(id);
  save('fav', APP.fav); render();
  toast(i >= 0 ? 'تم الحذف من المفضلة' : 'تم حفظ المتجر في المفضلة', 'ok', i >= 0 ? '🗑️' : '❤️');
}
function favProduct(id) {
  const i = APP.fav.products.indexOf(id);
  if (i >= 0) APP.fav.products.splice(i, 1); else APP.fav.products.push(id);
  save('fav', APP.fav); render();
  toast(i >= 0 ? 'تم إلغاء متابعة المنتج' : 'تتابع هذا المنتج الآن', 'ok', i >= 0 ? '🗑️' : '❤️');
}

function egyptMap(o) {
  o = o || {};
  const h = o.height || 430;
  return `
  <div class="mapbox" id="egWrap" style="height:${h}px">
    <svg class="map-svg" id="egMap" viewBox="${EG_VIEW}" preserveAspectRatio="xMidYMid meet" style="height:${h}px">
      <defs>
        <linearGradient id="gLand" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FCFBFB"/><stop offset="1" stop-color="#F3F1F1"/>
        </linearGradient>
        <filter id="pinShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".35"/>
        </filter>
      </defs>
      <g id="egLayer">
        <rect x="0" y="0" width="780" height="700" fill="#EDEBEB"/>

function drawEgyptMap() {
  const svg = $('#egMap'); if (!svg) return;
  const wrap = $('#egWrap'), pop = $('#egPop');
  const base = { x: 0, y: 0, w: 780, h: 700 };
  let vb = Object.assign({}, base);
  const apply = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const zoom = (f, cx, cy) => {
    const nw = clamp(vb.w * f, 140, 900), nh = nw * (base.h / base.w);
    const px = cx == null ? vb.x + vb.w / 2 : cx, py = cy == null ? vb.y + vb.h / 2 : cy;
    vb.x = clamp(px - (px - vb.x) * (nw / vb.w), -40, base.w - nw + 40);
    vb.y = clamp(py - (py - vb.y) * (nh / vb.h), -40, base.h - nh + 40);
    vb.w = nw; vb.h = nh; apply();
  };
  $('#egIn').onclick = () => zoom(0.75);
  $('#egOut').onclick = () => zoom(1.33);
  $('#egReset').onclick = () => { vb = Object.assign({}, base); apply(); hide(); };
  $('#egFindMe').onclick = () => { zoomTo(APP.loc.lon, APP.loc.lat, 0.34); };
  function zoomTo(lon, lat, w) {
    vb.w = base.w * w; vb.h = base.h * w;
    vb.x = clamp(PX(lon) - vb.w / 2, -40, base.w - vb.w + 40);
    vb.y = clamp(PY(lat) - vb.h / 2, -40, base.h - vb.h + 40);
    apply();
  }
  // سحب
  let drag = null;
  svg.addEventListener('pointerdown', e => {
    if (e.target.closest('.pin')) return;
    drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y }; svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    vb.x = clamp(drag.vx - (e.clientX - drag.x) * vb.w / r.width, -40, base.w - vb.w + 40);
    vb.y = clamp(drag.vy - (e.clientY - drag.y) * vb.h / r.height, -40, base.h - vb.h + 40);
    apply();
  });
  svg.addEventListener('pointerup', () => { drag = null; });

  function hide() { pop.innerHTML = ''; }
  wrap.querySelectorAll('.pin').forEach(g => {
    g.onclick = (e) => {
      e.stopPropagation();
      const st = DB.stores.find(s => s.id === g.dataset.store);
      const r = g.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      const cx = r.left + r.width / 2 - wr.left, cy = r.top - wr.top;
      pop.innerHTML = `<div class="map-pop" style="inset-inline-start:auto;left:${clamp(cx - 115, 8, wr.width - 250)}px;top:${clamp(cy - (cy > 210 ? 215 : -14), 8, wr.height - 40)}px">${storePop(st)}</div>`;
      pop.querySelectorAll('[data-act]').forEach(btn => {
        btn.onclick = () => { if (window.__act) window.__act(btn); };
      });
      bindGlobal();
    };
  });
  svg.addEventListener('click', e => { if (!e.target.closest('.pin')) hide(); });
  drawEgyptMap.zoomTo = zoomTo;
}

function radialMap(rows, radiusKm, height) {
  const h = height || 430, C = 390, R = 320;
  // ترتيب الزوايا بتباعد ذهبي لتقليل التزاحم
  const sorted = rows.slice().sort((a, b) => a.dist - b.dist);
  const pts = sorted.map((r, i) => {
    const ang = ((i * 137.508) + hash(r.storeId || r.st.id) % 40) * Math.PI / 180;
    const rr = clamp(r.dist / radiusKm, 0.06, 1) * (R - 26);
    return { r, x: C + rr * Math.sin(ang), y: C - rr * Math.cos(ang) };
  });
  const rings = [0.25, 0.5, 0.75, 1];
  const best = rows.length ? Math.min.apply(null, rows.map(r => r.price)) : 0;
  const nearest = Math.min.apply(null, rows.map(r => r.dist).concat([99]));
  return `
  <div class="mapbox" id="radWrap" style="height:${h}px">
    <svg class="map-svg" viewBox="0 0 780 780" preserveAspectRatio="xMidYMid meet" style="height:${h}px">
      <defs>
        <radialGradient id="gRad" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#FCFBFB"/><stop offset="1" stop-color="#F3F1F1"/>
        </radialGradient>
      </defs>
      <rect x="0" y="0" width="780" height="780" fill="#F7F6F6" rx="14"/>
      <circle cx="${C}" cy="${C}" r="${R}" fill="url(#gRad)"/>
      ${rings.map(f => `
        <circle cx="${C}" cy="${C}" r="${(R * f).toFixed(1)}" fill="none" stroke="#DAD6D6" stroke-width="${f === 1 ? 1.6 : 1}" ${f < 1 ? 'stroke-dasharray="5 7"' : ''}/>
        <text class="ring-lbl" x="${C + 6}" y="${(C - R * f + 13).toFixed(1)}">${kmTxt(radiusKm * f)}</text>`).join('')}
      <line x1="${C}" y1="${C - R}" x2="${C}" y2="${C + R}" stroke="#EDEBEB" stroke-width="1"/>
      <line x1="${C - R}" y1="${C}" x2="${C + R}" y2="${C}" stroke="#EDEBEB" stroke-width="1"/>
      <g>
        <circle cx="${C}" cy="${C}" r="16" fill="#4B4647" opacity=".14"/>
        <circle cx="${C}" cy="${C}" r="8" fill="#4B4647" stroke="#fff" stroke-width="2.4"/>
        <text x="${C}" y="${C + 30}" text-anchor="middle" class="ring-lbl" font-size="11" fill="#4B4647" font-weight="800">موقعك</text>
      </g>
      ${pts.map(p => {
    const st = p.r.st, isBest = p.r.price === best, isNear = p.r.dist === nearest;
    const col = isBest ? '#800020' : isNear ? '#B58900' : (st.verified ? '#4B4647' : '#8D8888');
    const em = catOf(st.cats[0]).em;
    return `<g class="pin" data-store="${st.id}" data-x="${p.x}" data-y="${p.y}">
          <circle cx="${p.x}" cy="${p.y}" r="17" fill="#fff" stroke="${col}" stroke-width="3" filter="url(#pinShadow)"/>
          <text x="${p.x}" y="${p.y + 5}" text-anchor="middle" font-size="15">${em}</text>
          ${isBest ? `<text x="${p.x}" y="${p.y - 22}" text-anchor="middle" font-size="10" font-weight="800" fill="#63001A" style="paint-order:stroke;stroke:#fff;stroke-width:3">أرخص</text>` : ''}
          ${isNear && !isBest ? `<text x="${p.x}" y="${p.y - 22}" text-anchor="middle" font-size="10" font-weight="800" fill="#8A6600" style="paint-order:stroke;stroke:#fff;stroke-width:3">أقرب</text>` : ''}
        </g>`;
  }).join('')}
    </svg>
    <div class="map-tools"><button id="radIn">＋</button><button id="radOut">－</button><button id="radReset">⟳</button></div>
    <div class="map-legend">
      <span class="row gap6"><i class="dot" style="background:#800020"></i> أرخص سعر في النطاق</span>
      <span class="row gap6"><i class="dot" style="background:#B58900"></i> أقرب متجر</span>
      <span class="row gap6"><i class="dot" style="background:#4B4647"></i> متجر موثق</span>
    </div>
    <div id="radPop"></div>
  </div>`;
}

/* ---------- رسوم بيانية ---------- */
function lineChart(points, o) {
  o = o || {};
  const W = 640, H = o.h || 200, pad = { t: 16, r: 14, b: 26, l: 52 };
  const vals = points.map(p => p.v);
  const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  const lo = mn - (mx - mn) * .18, hi = mx + (mx - mn) * .18 || 1;
  const X = i => pad.l + (W - pad.l - pad.r) * (points.length <= 1 ? .5 : i / (points.length - 1));
  const Y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - lo) / (hi - lo));
  const d = points.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const area = d + ` L ${X(points.length - 1)} ${H - pad.b} L ${X(0)} ${H - pad.b} Z`;
  const ticks = [0, .25, .5, .75, 1].map(f => Math.round(lo + (hi - lo) * f));
  const last = points[points.length - 1].v, first = points[0].v;
  const up = last >= first;
  return `
  <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="gc${o.id || 'x'}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${up ? '#B58900' : '#800020'}" stop-opacity=".26"/>
      <stop offset="1" stop-color="${up ? '#B58900' : '#800020'}" stop-opacity="0"/>
    </linearGradient></defs>
    ${ticks.map(t => `<g><line x1="${pad.l}" y1="${Y(t).toFixed(1)}" x2="${W - pad.r}" y2="${Y(t).toFixed(1)}" stroke="#F3F1F1"/><text x="${pad.l - 8}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#777272" class="num">${nf(t)}</text></g>`).join('')}
    <path d="${area}" fill="url(#gc${o.id || 'x'})"/>
    <path d="${d}" fill="none" stroke="${up ? '#C08A00' : '#800020'}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p, i) => `<g><circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i === points.length - 1 ? 5 : 3.4}" fill="#fff" stroke="${up ? '#C08A00' : '#800020'}" stroke-width="2.4"><title>${p.m}: ${nf(p.v)} ج.م</title></circle>
      ${i % 2 === 0 || i === points.length - 1 ? `<text x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10" fill="#777272">${p.m}</text>` : ''}</g>`).join('')}
  </svg>`;
}
function barChart(labels, values, o) {
  o = o || {};
  const mx = Math.max.apply(null, values) || 1;
  return `<div class="bars">${values.map((v, i) => `<i style="height:${Math.max(6, v / mx * 100)}%" title="${labels[i]}: ${nf(v)}"><span>${labels[i]}</span></i>`).join('')}</div>`;
}
function donut(p, label, color) {
  const R = 42, C = 2 * Math.PI * R, off = C * (1 - p / 100);
  return `<div class="row gap14">
    <svg viewBox="0 0 110 110" style="width:104px;height:104px;flex:0 0 auto">
      <circle cx="55" cy="55" r="${R}" fill="none" stroke="#EDEBEB" stroke-width="12"/>
      <circle cx="55" cy="55" r="${R}" fill="none" stroke="${color || '#800020'}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 55 55)"/>
      <text x="55" y="60" text-anchor="middle" font-size="20" font-weight="800" fill="#2B2728">${Math.round(p)}%</text>
    </svg>
    <div><div class="b">${label}</div><div class="tiny muted">محسوبة من عدد الأسعار ذات آخر تحديث معروف داخل القاعدة.</div></div>
  </div>`;
}

const OSM_CAT_META = { other: ['🏬', 'متاجر أخرى'] };

/* ------------------------- 1. أدوات مساعدة ------------------------- */
function arNorm(s) {
  return String(s == null ? '' : s).replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim().toLowerCase();
}
function realCatInfo(cat) {
  const c = CATS.find(x => x.id === cat);
  if (c) return { id: c.id, ar: c.ar, em: c.em };
  return { id: 'other', ar: OSM_CAT_META.other[1], em: OSM_CAT_META.other[0] };
}
/* نوع المحل من وسوم OSM */
function osmKindOf(tags) {
  tags = tags || {};
  const keys = ['shop', 'amenity', 'craft', 'healthcare', 'leisure'];
  // خرائط صريحة فقط: أي عنصر غير تجاري (بنك/مستشفى/مدرسة) لا يُعتبر محلًا
  for (const k of keys) if (tags[k]) { const hit = OSM_TYPES[k + '=' + tags[k]]; if (hit) return { kind: k, val: tags[k], cat: hit[0], ar: hit[1] }; }
  if (tags.shop) return { kind: 'shop', val: tags.shop, cat: 'other', ar: 'متجر' };
  if (tags.craft) return { kind: 'craft', val: tags.craft, cat: 'other', ar: 'ورشة' };
  return null;
}
/* الاسم: عربي إن وُجد، وإلا الاسم المسجّل أو العلامة التجارية، وإلا وصف واضح */
function osmName(tags, arType) {
  tags = tags || {};
  const ar = tags['name:ar'], nm = tags.name, en = tags['name:en'];
  const main = (ar && /[ء-ي]/.test(ar) ? ar : nm || en || tags.brand || tags.operator || '');
  if (main) return main;
  return arType + ' (بدون اسم مسجّل)';
}
/* مواعيد العمل: محاولة قراءة الوسم النصي، وإن فشلنا نقول «غير معروفة» بصراحة */
function parseOH(s) {
  if (!s || typeof s !== 'string') return null;
  const t = s.trim();
  if (/^24\s*\/\s*7/i.test(t)) return { always: true, raw: t };
  let m = t.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if (m) return { always: false, openH: (+m[1]) + (+m[2]) / 60, closeH: (+m[3]) + (+m[4]) / 60, raw: t };
  m = t.match(/(\d{1,2})\s*-\s*(\d{1,2})/);
  if (m) return { always: false, openH: +m[1], closeH: +m[2], raw: t };
  return { always: false, openH: null, closeH: null, raw: t };
}
function realHoursText(st) {
  if (!st) return 'مواعيد غير مسجّلة';
  if (st.hoursAlways) return 'مفتوح 24 ساعة';
  if (st.openH == null || st.closeH == null) return 'مواعيد غير مسجّلة';
  if (st.hoursRaw && st.hoursRaw.length <= 26) return st.hoursRaw.replace(/;/g, ' · ');
  return timeTxt(st.openH) + ' — ' + timeTxt(st.closeH);
}
/* حالة المحل: مفتوح / مغلق / غير معروفة — بلا تخمين */
function realOpenState(st) {
  if (!st) return 'unknown';
  if (st.hoursAlways) return 'open';
  if (st.openH == null || st.closeH == null) return 'unknown';
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  if (st.closeH > st.openH) return (h >= st.openH && h < st.closeH) ? 'open' : 'closed';
  return (h >= st.openH || h < st.closeH) ? 'open' : 'closed';
}
function realOpenBadge(st) {
  const s = realOpenState(st);
  if (s === 'open') return '<span class="badge ok"><i class="dot g"></i> مفتوح الآن (حسب مواعيد OSM)</span>';
  if (s === 'closed') return '<span class="badge ink"><i class="dot r"></i> مغلق حاليًا</span>';
  return '<span class="badge ink">🕒 مواعيد غير مسجّلة</span>';

function realAddr(tags, area) {
  tags = tags || {};
  const str = [tags['addr:street'], tags['addr:housenumber']].filter(Boolean).join(' ');
  const ar2 = tags['addr:suburb'] || tags['addr:neighbourhood'] || tags['addr:quarter'] || tags['addr:district'];
  const city = tags['addr:city'] || tags['addr:town'] || tags['addr:village'] || tags['addr:state'];
  const parts = [str, ar2 || area, city].filter(Boolean);
  return parts.join('، ');
}
/* وسم OSM → متجر داخل التطبيق */
function osmToStore(el, uLat, uLon) {
  if (!el || !el.tags) return null;
  const info = osmKindOf(el.tags);
  if (!info) return null;
  const lat = el.lat != null ? el.lat : (el.center && el.center.lat);
  const lon = el.lon != null ? el.lon : (el.center && el.center.lon);
  if (lat == null || lon == null) return null;
  const tags = el.tags;
  const oh = parseOH(tags.opening_hours);
  const id = 'osm-' + (el.type === 'node' ? 'n' : el.type === 'way' ? 'w' : 'r') + el.id;
  const st = {
    id, real: true, source: 'osm', osmRef: el.type + '/' + el.id,
    name: osmName(tags, info.ar), cat: info.cat, catAr: info.ar, subLabel: info.ar,
    cats: [info.cat], lat, lon,
    area: tags['addr:suburb'] || tags['addr:neighbourhood'] || tags['addr:district'] || '',
    city: tags['addr:city'] || tags['addr:town'] || tags['addr:village'] || tags['addr:state'] || '',
    address: realAddr(tags, REAL.where || ''),
    phone: tags.phone || tags['contact:phone'] || tags.mobile || '',
    website: tags.website || tags['contact:website'] || '',
    hoursRaw: tags.opening_hours || '', hoursAlways: !!(oh && oh.always),
    openH: oh && !oh.always && oh.openH != null ? oh.openH : null,
    closeH: oh && !oh.always && oh.closeH != null ? oh.closeH : null,
    verified: false, rating: 0, rc: 0, plan: 'osm', delivery: false,
    pay: [], svc: [], fri: '', joined: null, views: 0, clicksWa: 0, calls: 0, dirs: 0, weekly: [],
    desc: '', tags, distKm: distKm({ lat: uLat, lon: uLon }, { lat, lon })

  // تعديلات المستخدم المحلية على بيانات OSM
  const e = REAL.edits[id];
  if (e) { if (e.name) st.name = e.name; if (e.catAr) { st.catAr = e.catAr; st.subLabel = e.catAr; } if (e.area) st.area = e.area; if (e.note) st.desc = e.note; st.edited = true; }
  return st;
}
/* إزالة التكرار: نفس الاسم داخل 80 مترًا = محل واحد */
function dedupeReal(list) {
  const out = [];
  list.forEach(s => {
    const dup = out.find(o => arNorm(o.name) === arNorm(s.name) && distKm(o, s) < 0.08);
    if (!dup) { out.push(s); return; }
    // نحتفظ بالأغنى بيانات
    const rich = (o) => (o.phone ? 2 : 0) + (o.hoursRaw ? 2 : 0) + (o.address ? 1 : 0) + Object.keys(o.tags || {}).length / 10;
    if (rich(s) > rich(dup)) Object.assign(dup, s);
  });
  return out;
}
function realQuery(lat, lon, radiusM) {
  const A = `(around:${radiusM},${lat.toFixed(6)},${lon.toFixed(6)})`;
  return `[out:json][timeout:25];(` +
    `nwr["shop"]${A};` +
    `nwr["amenity"~"^(restaurant|cafe|fast_food|food_court|ice_cream|pharmacy|marketplace|fuel|car_wash|car_repair|bakery|internet_cafe|juice_bar)$"]${A};` +
    `nwr["craft"]${A};` +
    `nwr["healthcare"="pharmacy"]${A};` +
    `);out center tags 400;`;
}
const realHost = (u) => String(u).replace(/^https?:\/\//, '').split('/')[0];

/* ------------------------- 2. الاتصال بالخدمة ------------------------- */
async function realFetch(query, ms) {
  if (typeof fetch !== 'function' || typeof AbortController !== 'function')
    throw new Error('no-fetch');
  let last = null;
  for (const url of OSM_ENDPOINTS) {
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), ms || 16000);
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(query),
        signal: ctl.signal
      });
      clearTimeout(t);
      if (!res.ok) { last = new Error('http:' + res.status); continue; }
      const json = await res.json();
      REAL.endpoint = realHost(url);
      return json;
    } catch (e) { last = e; }
  }
  throw last || new Error('service');
}
async function realGeocodeArea(q) {
  if (typeof fetch !== 'function') throw new Error('no-fetch');
  const url = NOMINATIM + '?format=json&limit=1&countrycodes=eg&accept-language=ar&q=' + encodeURIComponent(q);
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error('http:' + res.status);
  const j = await res.json();
  if (!j.length) return null;
  return { lat: +j[0].lat, lon: +j[0].lon, where: j[0].display_name.split(',').slice(0, 2).join('، ') };
}
function realErrMsg(e) {
  const m = String((e && e.message) || e || '');
  if (m === 'no-fetch') return 'المتصفح لا يدعم الاتصال بالخدمة، أو المتصفح يمنع الطلبات الخارجية في هذه البيئة.';
  if (m.includes('http:403') || m.includes('http:429')) return 'خدمة OpenStreetMap رفضت الطلب مؤقتًا (حد استخدام). استنى دقيقة وجرّب تاني.';
  if (m === 'service' || m.includes('abort')) return 'تعذّر الوصول لخدمة OpenStreetMap. تأكد من الإنترنت وجرّب مرة أخرى.';
  return 'تعذّر الوصول لخدمة OpenStreetMap (' + (m || 'خطأ غير معروف') + ').';
}
const realIsNetworkBlocked = () => /no-fetch|Failed to fetch|NetworkError|Load failed|ERR_|abort/i.test(REAL.err || '');

/* ------------------------- 3. الموقع الحقيقي ------------------------- */
function realLocate() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('geo-unsupported'));
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy || 0) }),
      err => reject(new Error(err && err.code === 1 ? 'geo-denied' : err && err.code === 3 ? 'geo-timeout' : 'geo-fail')),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 120000 }
    );
  });
}
function realLocateMsg(e) {
  const m = String((e && e.message) || '');
  if (m === 'geo-unsupported') return 'جهازك/المتصفح لا يدعم تحديد الموقع. اختر منطقتك من القائمة وجرّب.';
  if (m === 'geo-denied') return 'رفضت مشاركة الموقع. اختر منطقتك من القائمة يدويًا — البحث هيبقى حقيقي برضه.';
  if (m === 'geo-timeout') return 'تحديد الموقع أخد وقتًا طويلًا. جرّب تاني أو اختر منطقتك يدويًا.';
  return 'تعذّر تحديد موقعك. اختار منطقتك من القائمة.';
}
function realApprox() {
  const n = DB.stores.map(s => Object.assign({}, s, { d: distKm(LOC, s) })).sort((a, b) => a.d - b.d)[0];
  return n ? { where: n.area + ' — ' + n.city, lat: APP.loc.lat, lon: APP.loc.lon } : { where: APP.loc.label, lat: APP.loc.lat, lon: APP.loc.lon };
}

/* ------------------------- 4. البحث ------------------------- */
function realApplyFilter() {
  const kw = arNorm(REAL.keyword);
  REAL.items = REAL.all.filter(s => {
    if (REAL.cat && s.cat !== REAL.cat) return false;
    if (REAL.openOnly && realOpenState(s) !== 'open') return false;
    if (kw && !(arNorm(s.name).includes(kw) || arNorm(s.catAr).includes(kw) || arNorm(s.area).includes(kw) || arNorm(s.city).includes(kw))) return false;
    return true;
  });
  return REAL.items;
}
function realCatCounts() {
  const m = {};
  REAL.all.forEach(s => m[s.cat] = (m[s.cat] || 0) + 1);
  return m;
}
async function realSearch(opts) {
  opts = opts || {};
  if (opts.radiusKm) REAL.radiusKm = parseFloat(opts.radiusKm);
  if (opts.keyword != null) REAL.keyword = opts.keyword;
  if (opts.cat != null) REAL.cat = opts.cat;
  if (opts.openOnly != null) REAL.openOnly = opts.openOnly;
  if (opts.locate) {
    REAL.status = 'locating'; REAL.err = ''; realRefreshUI();
    try {
      const p = await realLocate();
      REAL.lat = p.lat; REAL.lon = p.lon; REAL.acc = p.acc;
      REAL.where = 'موقعك الحالي' + (p.acc ? ' (±' + p.acc + ' م)' : '');
      APP.loc = { lat: p.lat, lon: p.lon, label: REAL.where, area: 'موقعك الحالي', city: '', exact: true };
      save('loc', APP.loc);
    } catch (e) { REAL.status = 'error'; REAL.err = realLocateMsg(e); realRefreshUI(); return false; }
  }
  if (REAL.lat == null) {
    REAL.status = 'error';
    REAL.err = 'لسه محددناش موقعك. اضغط «📍 استخدم موقعي» أو اختار منطقتك من القائمة.';
    realRefreshUI(); return false;
  }
  REAL.status = 'loading'; REAL.err = ''; REAL.note = ''; realRefreshUI();
  try {
    const json = await realFetch(realQuery(REAL.lat, REAL.lon, Math.max(300, Math.round(REAL.radiusKm * 1000))));
    const list = (json.elements || []).map(el => osmToStore(el, REAL.lat, REAL.lon))
      .filter(s => s && s.distKm <= REAL.radiusKm + 0.02);
    REAL.all = dedupeReal(list).sort((a, b) => a.distKm - b.distKm);
    REAL.at = Date.now(); REAL.usedCache = false;
    realApplyFilter();
    REAL.status = 'ready';
    realCacheSave();
    if (!REAL.all.length) REAL.note = 'مفيش محلات مسجّلة على OpenStreetMap في النطاق ده. جرّب توسّع النطاق أو غيّر المنطقة.';
    toast(REAL.all.length ? `لقينا <b>${REAL.all.length}</b> محلًا حقيقيًا حولك` : 'مفيش محلات مسجّلة في النطاق ده — وسّعه', REAL.all.length ? 'ok' : 'warn', REAL.all.length ? '🏬' : '🔍');
  } catch (e) {
    REAL.status = 'error'; REAL.err = realErrMsg(e);
  }
  realRefreshUI();
  return REAL.status === 'ready';
}
async function realSearchArea(q, opts) {
  opts = opts || {};
  const known = EG_AREAS.find(a => arNorm(a.ar) === arNorm(q));
  REAL.status = 'locating'; REAL.err = ''; realRefreshUI();
  try {
    let p = known ? { lat: known.lat, lon: known.lon, where: known.ar } : await realGeocodeArea(q);
    if (!p) { REAL.status = 'error'; REAL.err = 'مش عارفين نحدد «' + esc(q) + '» على الخريطة. اكتب اسم المنطقة أو المحافظة بشكل أوضح (مثال: المنصورة).'; realRefreshUI(); return false; }
    REAL.lat = p.lat; REAL.lon = p.lon; REAL.acc = null; REAL.where = p.where;
    APP.loc = { lat: p.lat, lon: p.lon, label: p.where, area: p.where, city: '', exact: false };
    save('loc', APP.loc);
  } catch (e) {
    REAL.status = 'error'; REAL.err = realErrMsg(e); realRefreshUI(); return false;

}
function realCacheSave() {

function realCacheLoad() {
  const c = load('realCache', null);
  if (!c || !c.items || !c.items.length) return false;
  REAL.lat = c.lat; REAL.lon = c.lon; REAL.where = c.where; REAL.radiusKm = c.radiusKm || REAL.radiusKm;
  REAL.endpoint = c.endpoint || '';
  REAL.all = c.items.map(s => Object.assign({
    real: true, source: 'osm', cats: [s.cat], verified: false, rating: 0, rc: 0, plan: 'osm',
    delivery: false, pay: [], svc: [], views: 0, desc: '', tags: {}
  }, s, { distKm: distKm({ lat: c.lat, lon: c.lon }, { lat: s.lat, lon: s.lon }) }))
    .sort((a, b) => a.distKm - b.distKm);
  REAL.at = c.at; REAL.status = 'ready'; REAL.usedCache = true;
  realApplyFilter();
  return true;
}

const realLastUpdate = () => {

/* خريطة الحي الحقيقية: إسقاط فعلي لإحداثيات المتاجر حول موقعك */
function realMap(items, uLat, uLon, radiusKm) {
  const W = 780, H = 620, cx = W / 2, cy = H / 2, pad = 46;
  const k = Math.cos(uLat * Math.PI / 180);
  const pxPerKm = (Math.min(W, H) / 2 - pad) / radiusKm;
  const pt = (lat, lon) => ({ x: cx + (lon - uLon) * 111.32 * k * pxPerKm, y: cy - (lat - uLat) * 110.57 * pxPerKm });
  const shown = items.slice(0, 90);
  return `
  <div class="mapbox mb14" id="realMapWrap" style="height:${H}px">
    <svg class="map-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="height:${H}px">
      <defs>
        <radialGradient id="rGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F1F1"/></radialGradient>
        <filter id="rPin"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#2B2728" flood-opacity=".22"/></filter>
      </defs>
      <rect width="${W}" height="${H}" rx="14" fill="#F7F6F6"/>
      <rect x="${pad / 2}" y="${pad / 2}" width="${W - pad}" height="${H - pad}" rx="12" fill="url(#rGlow)"/>
      ${[0.25, 0.5, 0.75, 1].map(f => `<circle cx="${cx}" cy="${cy}" r="${(pxPerKm * radiusKm * f).toFixed(1)}" fill="none" stroke="#DAD6D6" stroke-width="${f === 1 ? 1.6 : 1}" ${f < 1 ? 'stroke-dasharray="6 8"' : ''}/>
        <text x="${cx + 6}" y="${(cy - pxPerKm * radiusKm * f + 13).toFixed(1)}" class="ring-lbl">${kmTxt(radiusKm * f)}</text>`).join('')}
      <line x1="${cx}" y1="${pad / 2}" x2="${cx}" y2="${H - pad / 2}" stroke="#E5E2E2" stroke-width="1"/>
      <line x1="${pad / 2}" y1="${cy}" x2="${W - pad / 2}" y2="${cy}" stroke="#E5E2E2" stroke-width="1"/>
      <text x="${cx}" y="${pad / 2 - 8}" text-anchor="middle" class="ring-lbl">شمال ↑</text>
      <text x="${cx}" y="${H - pad / 2 + 18}" text-anchor="middle" class="ring-lbl">↓ جنوب</text>
      <text x="${W - pad / 2 + 26}" y="${cy + 4}" text-anchor="middle" class="ring-lbl">شرق</text>
      <text x="${pad / 2 - 26}" y="${cy + 4}" text-anchor="middle" class="ring-lbl">غرب</text>
      ${shown.map((s, i) => {
    const p = pt(s.lat, s.lon);
    if (p.x < 20 || p.x > W - 20 || p.y < 20 || p.y > H - 20) return '';
    const c = realCatInfo(s.cat), near = i < 3;
    return `<g class="pin real-pin" data-store="${s.id}">
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${near ? 17 : 14}" fill="#fff" stroke="${near ? '#800020' : '#8D8888'}" stroke-width="${near ? 3 : 2.2}" filter="url(#rPin)"/>
        <text x="${p.x.toFixed(1)}" y="${(p.y + 5).toFixed(1)}" text-anchor="middle" font-size="${near ? 15 : 13}">${c.em}</text>
        ${near ? `<text x="${p.x.toFixed(1)}" y="${(p.y - 22).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#63001A" style="paint-order:stroke;stroke:#fff;stroke-width:3">${esc(String(s.name).slice(0, 22))}</text>` : ''}
      </g>`;
  }).join('')}
      <g>
        <circle cx="${cx}" cy="${cy}" r="17" fill="#800020" opacity=".14"/>
        <circle cx="${cx}" cy="${cy}" r="8" fill="#800020" stroke="#fff" stroke-width="2.6"/>
        <text x="${cx}" y="${cy + 30}" text-anchor="middle" class="ring-lbl" font-size="11" fill="#63001A" font-weight="800">موقعك</text>
      </g>
    </svg>
    <div class="map-legend">
      <span class="row gap6"><i class="dot" style="background:#800020"></i> أقرب ٣ محلات</span>
      <span class="row gap6"><i class="dot" style="background:#8D8888"></i> باقي المحلات الحقيقية</span>
    </div>
  </div>`;
}

/* شريط صغير لصفحة نتائج البحث: محلات حقيقية بنفس الاسم */
function realMatchesFor(q, limit) {
  const kw = arNorm(q);
  if (!kw || !REAL.all.length) return [];
  const words = kw.split(' ').filter(w => w.length > 2);
  const score = (s) => {
    const t = arNorm(s.name + ' ' + s.catAr + ' ' + (s.city || '') + ' ' + (s.area || ''));
    return words.reduce((n, w) => n + (t.includes(w) ? 1 : 0), 0);
  };
  return REAL.all.map(s => ({ s, n: score(s) })).filter(x => x.n >= Math.min(2, words.length)).sort((a, b) => b.n - a.n || a.s.distKm - b.s.distKm).slice(0, limit || 3).map(x => x.s);
}
function realSearchStrip(q) {
  const hits = realMatchesFor(q, 3);
  if (!hits.length) return '';
  return `<div class="card pad mb14 real-strip">
    <div class="between wrapx mb10"><div class="b">🏬 محلات حقيقية مطابقة لبحثك (من OpenStreetMap)</div>
    <a class="btn sm2" href="#/nearby">كل المحلات حولي ←</a></div>
    <div class="grid g-auto">${hits.map(s => realCard(s)).join('')}</div>
  </div>`;
}

    if (pid === '__other' && !otherName) { toast('اكتب اسم المنتج', 'warn', '⚠️'); return; }
    const r = saveUserPrice({ storeId, productId: pid, otherName, price, unit: $('#rpUnit').value.trim(), note: $('#rpNote').value.trim(), inStock: $('#rpStock').checked });
    closeModal();
    if (r.ok) { toast('تم تسجيل السعر: ' + nf(price) + ' ج.م لـ ' + esc(r.product.name), 'ok', '💰'); render(); }
    else toast(r.msg || 'تعذّر الحفظ', 'warn', '⚠️');
  };
}
function saveUserPrice(o) {
  const st = DB.stores.find(s => s.id === o.storeId);
  if (!st) return { ok: false, msg: 'المحل غير موجود' };
  let p = null;
  if (o.productId === '__other') {
    p = { id: 'u-' + uid(), name: o.otherName, cat: st.cat || 'home', em: '🏷️', unit: o.unit || '', userMade: true };
    PRODUCTS.push(p);
  } else {
    p = PRODUCTS.find(x => x.id === o.productId);
    if (!p) return { ok: false, msg: 'المنتج غير معروف' };
  }
  const l = {
    id: uid(), storeId: st.id, productId: p.id, price: +o.price, oldPrice: 0, disc: 0,
    inStock: o.inStock !== false, updatedH: 0, source: 'user', by: 'أنت', at: Date.now(),
    unit: o.unit || p.unit || '', note: o.note || ''
  };
  DB.listings.push(l);
  (DB.byStore[st.id] = DB.byStore[st.id] || []).push(l);
  (DB.byProduct[p.id] = DB.byProduct[p.id] || []).push(l);
  DB.priceLog.push({ at: Date.now(), storeId: st.id, productId: p.id, price: l.price, by: 'user', source: 'user', note: o.note || '' });
  persistUserPrices();
  return { ok: true, product: p, listing: l };
}
function persistUserPrices() {
  const arr = DB.listings.filter(l => l.source === 'user').map(l => {
    const st = DB.stores.find(s => s.id === l.storeId) || {};
    const p = PRODUCTS.find(x => x.id === l.productId) || {};
    return {
      listing: { productId: l.productId, price: l.price, inStock: l.inStock, unit: l.unit, note: l.note, at: l.at, by: l.by },
      product: p.userMade ? { id: p.id, name: p.name, cat: p.cat, em: p.em, unit: p.unit } : null,
      store: {
        id: st.id, name: st.name, cat: st.cat, catAr: st.catAr, lat: st.lat, lon: st.lon, real: !!st.real,
        area: st.area, city: st.city, address: st.address, phone: st.phone, osmRef: st.osmRef,
        hoursRaw: st.hoursRaw, hoursAlways: st.hoursAlways, openH: st.openH, closeH: st.closeH
      }
    };
  });
  save('userPrices', arr.slice(-300));
}
function loadUserPrices() {
  const arr = load('userPrices', []);
  if (!Array.isArray(arr) || !arr.length) return 0;
  let n = 0;
  arr.forEach(rec => {
    if (!rec || !rec.store || !rec.listing) return;
    const s = rec.store;
    if (!PRODUCTS.some(p => p.id === rec.listing.productId) && rec.product) PRODUCTS.push(rec.product);
    if (!DB.stores.some(x => x.id === s.id)) {
      DB.stores.push(Object.assign({
        real: true, source: 'osm', cats: [s.cat || 'other'], verified: false, rating: 0, rc: 0,
        plan: 'osm', delivery: false, pay: [], svc: [], views: 0, weekly: [], tags: {}, distKm: null
      }, s, { id: s.id, cats: [s.cat || 'other'] }));
      DB.byStore[s.id] = DB.byStore[s.id] || [];
    }
    if (DB.listings.some(l => l.storeId === s.id && l.productId === rec.listing.productId)) return;
    const l = Object.assign({ id: uid(), storeId: s.id, oldPrice: 0, disc: 0, updatedH: 0, source: 'user', by: 'أنت' }, rec.listing);
    DB.listings.push(l);
    (DB.byStore[s.id] = DB.byStore[s.id] || []).push(l);
    (DB.byProduct[l.productId] = DB.byProduct[l.productId] || []).push(l);
    n++;
  });
  return n;
}
/* دمج نتيجة حقيقية في قاعدة البيانات العامة حتى تعمل صفحة المحل والسعر */
function realEnsureInDB(st) {
  if (!st) return null;
  const found = DB.stores.find(s => s.id === st.id);
  if (found) {
    if (st.distKm != null) found.distKm = st.distKm;
    return found;
  }
  DB.stores.push(st);
  DB.byStore[st.id] = DB.byStore[st.id] || [];
  return st;
}
